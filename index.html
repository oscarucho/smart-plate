<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 14px;

    font-family: Arial, sans-serif;

    background: #f1f4f8;

    text-align: center;
}


/* =========================================
   TITULO
========================================= */

h1 {
    margin: 5px 0 2px 0;
    font-size: 30px;
}

.subtitulo {
    margin-bottom: 15px;
    color: #666;

/* =========================================
   CAMARA
========================================= */

.contenedorCamara {

    position: relative;

    width: 100%;
    max-width: 850px;

    margin: auto;

    overflow: hidden;

    border-radius: 18px;

    background: #000;

    min-height: 220px;
}

video {

    display: block;

    width: 100%;

    background: #000;
}

#overlay {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

}

   BOTONES
========================================= */

.botones {

    margin-top: 14px;

    display: flex;

    justify-content: center;

    align-items: center;

}


button {

    border: none;

    padding: 14px 20px;

    font-size: 16px;

    font-weight: bold;

    color: white;

    cursor: pointer;

#btnIniciar {
    background: #1976d2;
}


#btnDetener {
    background: #d32f2f;

#btnRegistros {

    background: #0f9d58;

    color: white;

    text-decoration: none;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    border-radius: 12px;

    padding: 14px 20px;

    font-size: 16px;

    font-weight: bold;
}


button:disabled {
    opacity: 0.45;
}


/* =========================================
   PANEL
========================================= */

.panel {

    width: 100%;

    max-width: 850px;

    margin: 14px auto;

    padding: 16px;

    border-radius: 16px;

    background: white;
}


#estado {

    font-size: 19px;

    font-weight: bold;
}


#detalle {

    margin-top: 6px;

    color: #777;

    font-size: 13px;
}


#debug {

    margin-top: 8px;

    color: #888;

    font-size: 11px;

}


/* =========================================
   ULTIMA PLACA
========================================= */

.tituloResultado {

    color: #666;

    font-size: 13px;
}


#ultimaPlaca {

    margin-top: 8px;

    font-size: 40px;

    font-weight: bold;

    letter-spacing: 4px;
}


/* =========================================
   ESTADISTICAS
========================================= */

.estadisticas {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 15px;
}


.tarjeta {

    min-width: 130px;

    padding: 12px;

    border-radius: 12px;

    background: #f4f6f8;
}


.numero {

    font-size: 25px;

    font-weight: bold;
}


.etiqueta {

    margin-top: 4px;

    font-size: 11px;

    color: #777;
}


/* =========================================
   PLACAS
========================================= */

#listaPlacas {

    margin-top: 12px;
}


.placaItem {

    display: inline-block;

    margin: 5px;

    padding: 10px 14px;

    border-radius: 10px;

    background: #e8f5e9;

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 2px;
}


.confianza {

    margin-top: 3px;

    font-size: 11px;

    font-weight: normal;

    letter-spacing: 0;

    color: #555;
}


/* =========================================
   SERVIDOR
========================================= */

.punto {

    display: inline-block;

    width: 11px;
    height: 11px;

    margin-right: 6px;

    border-radius: 50%;

    background: #999;
}


/* =========================================
   CANVAS OCULTO
========================================= */

#captura {
    display: none;
}


/* =========================================
   CELULAR
========================================= */

@media (max-width: 600px) {

    button,
    #btnRegistros {

        padding: 12px 13px;

        font-size: 14px;
    }

    #ultimaPlaca {

        font-size: 31px;
    }

}

</style>

</head>


<body>


<h1>

</h1>


<div class="subtitulo">

Sistema inteligente de control vehicular - Edificio Fisher 155

<div class="contenedorCamara">

<div class="panel">

                <span
                    class="punto"

                ></span>

     PLACAS DETECTADAS
========================================= -->

<div class="panel">


    <b>
        PLACAS DETECTADAS
    </b>


    <div id="listaPlacas">

        ---

    </div>


</div>



<!-- =========================================
     CANVAS OCULTO
========================================= -->

<canvas id="captura"></canvas>



<script>


/* =========================================================
   CONFIGURACION
========================================================= */


const API_URL =

"https://script.google.com/macros/s/AKfycbxbGFvAs1T4_-Aq_jYhF22G0LdS4Y9oA92lKZOzMtuB2EaObpVd1shjc6r85kw_mJaL/exec";



/*
Tiempo después de terminar una lectura
para comenzar otra.
*/

const ESPERA_ENTRE_LECTURAS =
    1200;



/*
Resolución enviada.
*/

const ANCHO_ENVIO =
    1100;



/*
Calidad JPEG.
*/

const CALIDAD_JPEG =
    0.82;



/*
Máximo tiempo esperando
resultado del servidor.
*/

const MAX_ESPERA_RESULTADO =
    12000;



/*
Cada cuánto consultar resultado.
*/

const INTERVALO_CONSULTA =
    450;



/*
Evita contar varias veces
el mismo vehículo.
*/

const TIEMPO_DUPLICADO =
    15000;



/* =========================================================
   VARIABLES
========================================================= */


let streamCamara =
    null;


let camaraActiva =
    false;


let cicloOcupado =
    false;


let temporizador =
    null;


let totalVehiculos =
    0;


const historial =
    new Map();



/*
ID de sesión.
*/

const SESION =

    sessionStorage.getItem(
        "smartPlateSesion"
    )

    ||

    crearId();



sessionStorage.setItem(

    "smartPlateSesion",

    SESION

);



/* =========================================================
   CREAR ID
========================================================= */


function crearId() {


    if (

        window.crypto

        &&

        crypto.randomUUID

    ) {


        return crypto.randomUUID();

    }


    return (

        Date.now()

        +

        "-"

        +

        Math.random()
            .toString(36)
            .substring(2)

    );

}



/* =========================================================
   MENSAJES
========================================================= */


function mensaje(

    texto,

    detalle = ""

) {


    document.getElementById(
        "estado"
    ).innerText =
        texto;


    document.getElementById(
        "detalle"
    ).innerText =
        detalle;

}



function debug(
    texto
) {


    document.getElementById(
        "debug"
    ).innerText =
        texto || "";

}



/* =========================================================
   ESTADO SERVIDOR
========================================================= */


function servidorEstado(
    estado
) {


    const punto =

        document.getElementById(
            "puntoServidor"
        );


    const texto =

        document.getElementById(
            "textoServidor"
        );


    if (estado === "on") {


        punto.style.background =
            "#00c853";


        texto.innerText =
            "ON";


    } else if (
        estado === "error"
    ) {


        punto.style.background =
            "#d50000";


        texto.innerText =
            "ERROR";


    } else {


        punto.style.background =
            "#999";


        texto.innerText =
            "...";

    }

}



/* =========================================================
   COMPROBAR SERVIDOR
========================================================= */


async function comprobarServidor() {


    servidorEstado(
        "espera"
    );


    try {


        const respuesta =

            await obtenerJSONP(

                API_URL

                +

                "?accion=estado"

            );


        if (

            respuesta

            &&

            respuesta.ok

            &&

            respuesta.token_configurado

        ) {


            servidorEstado(
                "on"
            );


            mensaje(

                "✅ Servidor conectado",

                "Presiona INICIAR para comenzar."

            );


            debug(

                "Plate Recognizer y Google Sheets disponibles."

            );


        } else {


            servidorEstado(
                "error"
            );


            mensaje(

                "❌ Servidor incompleto",

                "Verifica la configuración de Apps Script."

            );

        }


    } catch (error) {


        servidorEstado(
            "error"
        );


        mensaje(

            "❌ No se pudo comprobar el servidor",

            error.message

        );

    }

}



/* =========================================================
   INICIAR CAMARA
========================================================= */


async function iniciarCamara() {


    const video =

        document.getElementById(
            "video"
        );


    try {


        /*
        Evita iniciar dos cámaras.
        */

        if (camaraActiva) {

            return;

        }


        mensaje(

            "📷 Solicitando cámara...",

            "Permite el acceso a la cámara."

        );


        debug("");


        /*
        Comprobar compatibilidad.
        */

        if (

            !navigator.mediaDevices

            ||

            !navigator.mediaDevices.getUserMedia

        ) {


            throw new Error(

                "Este navegador no permite utilizar la cámara."

            );

        }



        /*
        Solicitar cámara trasera.
        */

        streamCamara =

            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {

                            ideal:
                                "environment"

                        },

                        width: {

                            ideal:
                                1920

                        },

                        height: {

                            ideal:
                                1080

                        }

                    },

                    audio:
                        false

                });



        video.srcObject =
            streamCamara;



        /*
        Esperar metadata.
        */

        if (

            video.readyState < 1

            ||

            !video.videoWidth

        ) {


            await new Promise(

                function(resolve) {


                    video.onloadedmetadata =

                        function() {

                            resolve();

                        };

                }

            );

        }



        await video.play();



        camaraActiva =
            true;


        cicloOcupado =
            false;



        document.getElementById(
            "btnIniciar"
        ).disabled =
            true;



        document.getElementById(
            "btnDetener"
        ).disabled =
            false;



        prepararOverlay();



        dibujarZonaLectura();



        mensaje(

            "🎯 Cámara lista",

            "Coloca la placa dentro de la zona amarilla."

        );



        debug(

            "Cámara: "
            +
            video.videoWidth
            +
            " × "
            +
            video.videoHeight

        );



        /*
        Primera captura.
        */

        temporizador =

            setTimeout(

                iniciarCiclo,

                800

            );


    } catch (error) {


        console.error(
            error
        );


        camaraActiva =
            false;


        mensaje(

            "❌ No se pudo iniciar la cámara",

            error.name
            ?
            error.name
            +
            ": "
            +
            error.message
            :
            error.message

        );


        debug(

            "Si Android pregunta por permisos, selecciona PERMITIR."

        );

    }

}



/* =========================================================
   DETENER CAMARA
========================================================= */


function detenerCamara() {


    camaraActiva =
        false;


    cicloOcupado =
        false;



    if (temporizador) {


        clearTimeout(
            temporizador
        );


        temporizador =
            null;

    }



    if (streamCamara) {


        streamCamara
            .getTracks()
            .forEach(

                function(track) {

                    track.stop();

                }

            );


        streamCamara =
            null;

    }



    const video =

        document.getElementById(
            "video"
        );


    video.srcObject =
        null;



    limpiarOverlay();



    document.getElementById(
        "btnIniciar"
    ).disabled =
        false;



    document.getElementById(
        "btnDetener"
    ).disabled =
        true;



    mensaje(

        "⏹ Cámara detenida",

        "Presiona INICIAR para continuar."

    );


    debug("");

}



/* =========================================================
   OVERLAY
========================================================= */


function prepararOverlay() {


    const video =

        document.getElementById(
            "video"
        );


    const overlay =

        document.getElementById(
            "overlay"
        );


    overlay.width =
        video.videoWidth;


    overlay.height =
        video.videoHeight;

}



/* =========================================================
   ZONA DE LECTURA
========================================================= */


function obtenerZonaLectura() {


    const video =

        document.getElementById(
            "video"
        );


    const width =

        video.videoWidth
        *
        0.90;


    const height =

        video.videoHeight
        *
        0.68;


    const x =

        (
            video.videoWidth
            -
            width
        )

        /
        2;


    const y =

        (
            video.videoHeight
            -
            height
        )

        *
        0.42;


    return {

        x:
            x,

        y:
            y,

        width:
            width,

        height:
            height

    };

}



/* =========================================================
   DIBUJAR ZONA AMARILLA
========================================================= */


function dibujarZonaLectura() {


    if (!camaraActiva) {

        return;

    }


    const overlay =

        document.getElementById(
            "overlay"
        );


    const ctx =

        overlay.getContext(
            "2d"
        );


    const zona =
        obtenerZonaLectura();



    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );



    ctx.strokeStyle =
        "#ffd600";


    ctx.lineWidth =
        5;


    ctx.setLineDash([
        20,
        12
    ]);


    ctx.strokeRect(

        zona.x,

        zona.y,

        zona.width,

        zona.height

    );


    ctx.setLineDash([]);



    ctx.fillStyle =
        "#ffd600";


    ctx.fillRect(

        zona.x,

        zona.y,

        245,

        40

    );


    ctx.fillStyle =
        "#000";


    ctx.font =
        "bold 24px Arial";


    ctx.fillText(

        "ZONA DE LECTURA",

        zona.x + 10,

        zona.y + 28

    );

}



/* =========================================================
   LIMPIAR OVERLAY
========================================================= */


function limpiarOverlay() {


    const overlay =

        document.getElementById(
            "overlay"
        );


    const ctx =

        overlay.getContext(
            "2d"
        );


    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );

}



/* =========================================================
   CICLO
========================================================= */


async function iniciarCiclo() {


    if (

        !camaraActiva

        ||

        cicloOcupado

    ) {


        return;

    }


    cicloOcupado =
        true;


    try {


        /*
        Captura.
        */

        await capturarYEnviar();



        /*
        Esperar respuesta.
        */

        const resultado =

            await esperarResultado();



        /*
        Procesar.
        */

        procesarResultado(
            resultado
        );


    } catch (error) {


        console.error(
            error
        );


        mensaje(

            "⚠️ Problema temporal",

            error.message

        );


    } finally {


        cicloOcupado =
            false;


        /*
        Nueva lectura solo después
        de terminar la anterior.
        */

        if (camaraActiva) {


            temporizador =

                setTimeout(

                    iniciarCiclo,

                    ESPERA_ENTRE_LECTURAS

                );

        }

    }

}



/* =========================================================
   CAPTURAR Y ENVIAR
========================================================= */


async function capturarYEnviar() {


    const video =

        document.getElementById(
            "video"
        );


    const canvas =

        document.getElementById(
            "captura"
        );


    const zona =
        obtenerZonaLectura();



    const anchoDestino =

        Math.min(

            ANCHO_ENVIO,

            Math.round(
                zona.width
            )

        );



    const altoDestino =

        Math.round(

            zona.height

            /

            zona.width

            *

            anchoDestino

        );



    canvas.width =
        anchoDestino;


    canvas.height =
        altoDestino;



    const ctx =

        canvas.getContext(
            "2d"
        );



    /*
    Pequeño aumento de contraste.
    */

    ctx.filter =

        "contrast(1.08) brightness(1.03)";



    ctx.drawImage(

        video,


        zona.x,

        zona.y,

        zona.width,

        zona.height,


        0,

        0,

        anchoDestino,

        altoDestino

    );


    ctx.filter =
        "none";



    const dataURL =

        canvas.toDataURL(

            "image/jpeg",

            CALIDAD_JPEG

        );



    const base64 =

        dataURL.split(
            ","
        )[1];



    mensaje(

        "📡 Enviando fotografía...",

        "Consultando Plate Recognizer."

    );



    debug(

        "Imagen enviada: "
        +
        anchoDestino
        +
        " × "
        +
        altoDestino

    );



    await fetch(

        API_URL,

        {

            method:
                "POST",

            mode:
                "no-cors",

            headers: {

                "Content-Type":

                    "text/plain;charset=utf-8"

            },

            body:

                JSON.stringify({

                    accion:
                        "analizar",

                    sesion:
                        SESION,

                    imagen:
                        base64,

                    tipo:
                        "image/jpeg",

                    width:
                        anchoDestino,

                    height:
                        altoDestino,

                    timestamp:
                        Date.now()

                })

        }

    );



    mensaje(

        "🧠 Reconociendo placa...",

        "Esperando respuesta."

    );

}



/* =========================================================
   ESPERAR RESULTADO
========================================================= */


async function esperarResultado() {


    const inicio =
        Date.now();



    while (

        camaraActiva

        &&

        Date.now() - inicio

        <
        MAX_ESPERA_RESULTADO

    ) {


        const url =

            API_URL

            +

            "?accion=resultado"

            +

            "&sesion="

            +

            encodeURIComponent(
                SESION
            )

            +

            "&t="

            +

            Date.now();



        try {


            const datos =

                await obtenerJSONP(
                    url
                );



            if (

                datos

                &&

                datos.procesando

            ) {


                mensaje(

                    "🧠 Reconociendo placa...",

                    "Esperando Plate Recognizer..."

                );


                await esperar(
                    INTERVALO_CONSULTA
                );


                continue;

            }



            if (datos) {


                return datos;

            }


        } catch (error) {


            console.warn(
                error
            );

        }



        await esperar(
            INTERVALO_CONSULTA
        );

    }



    throw new Error(

        "El servidor tardó demasiado."

    );

}



/* =========================================================
   JSONP
========================================================= */


function obtenerJSONP(
    url
) {


    return new Promise(

        function(resolve, reject) {


            const callback =

                "sp_"

                +

                Date.now()

                +

                "_"

                +

                Math.floor(
                    Math.random()
                    *
                    100000
                );



            const script =

                document.createElement(
                    "script"
                );



            let terminado =
                false;



            function limpiar() {


                try {

                    delete window[
                        callback
                    ];

                } catch (_) {}


                try {

                    script.remove();

                } catch (_) {}

            }



            window[callback] =

                function(datos) {


                    if (terminado) {

                        return;

                    }


                    terminado =
                        true;


                    limpiar();


                    resolve(
                        datos
                    );

                };



            script.onerror =

                function() {


                    if (terminado) {

                        return;

                    }


                    terminado =
                        true;


                    limpiar();


                    reject(

                        new Error(
                            "No se pudo consultar Apps Script."
                        )

                    );

                };



            script.src =

                url

                +

                (
                    url.includes("?")
                    ?
                    "&"
                    :
                    "?"
                )

                +

                "callback="

                +

                encodeURIComponent(
                    callback
                );



            document.body
                .appendChild(
                    script
                );



            setTimeout(

                function() {


                    if (terminado) {

                        return;

                    }


                    terminado =
                        true;


                    limpiar();


                    reject(

                        new Error(
                            "Tiempo agotado consultando servidor."
                        )

                    );

                },

                5000

            );

        }

    );

}



/* =========================================================
   PROCESAR RESULTADO
========================================================= */


function procesarResultado(
    datos
) {


    if (!datos) {


        mensaje(

            "❌ Sin respuesta",

            "Apps Script no devolvió información."

        );


        return;

    }



    /*
    Error real.
    */

    if (!datos.ok) {


        servidorEstado(
            "error"
        );


        mensaje(

            "❌ Error del detector",

            datos.error
            ||
            "Error desconocido"

        );


        if (datos.http) {


            debug(

                "HTTP "
                +
                datos.http

            );

        }


        return;

    }



    servidorEstado(
        "on"
    );



    /*
    Tiempo respuesta.
    */

    if (

        datos.processing_ms
        !== undefined

    ) {


        const segundos =

            Number(
                datos.processing_ms
            )

            /
            1000;



        document.getElementById(
            "tiempo"
        ).innerText =

            segundos.toFixed(1)
            +
            "s";

    }



    const resultados =

        Array.isArray(
            datos.results
        )

        ?

        datos.results

        :

        [];



    dibujarResultados(

        resultados,

        Number(
            datos.width || 1
        ),

        Number(
            datos.height || 1
        )

    );



    actualizarLista(
        resultados
    );



    procesarVehiculos(
        resultados
    );



    if (

        resultados.length === 0

    ) {


        mensaje(

            "🔎 No se encontró placa",

            "Mueve el vehículo o acerca la placa."

        );


        debug(

            "Plate Recognizer respondió: 0 placas."

        );


    } else {


        mensaje(

            "✅ "
            +
            resultados.length
            +
            (
                resultados.length === 1
                ?
                " placa detectada"
                :
                " placas detectadas"
            ),

            "Resultado registrado en Google Sheets."

        );


        debug(

            "Lectura realizada correctamente."

        );

    }

}



/* =========================================================
   FORMATO DE PLACA
========================================================= */


function formatearPlaca(
    texto
) {


    if (!texto) {

        return "";
    }



    const limpio =

        String(texto)
            .toUpperCase()
            .replace(

                /[^A-Z0-9]/g,

                ""

            );



    /*
    ABC123 -> ABC-123
    */

    if (

        /^[A-Z]{3}[0-9]{3}$/
        .test(limpio)

    ) {


        return (

            limpio.substring(
                0,
                3
            )

            +

            "-"

            +

            limpio.substring(
                3,
                6
            )

        );

    }



    return limpio;

}



/* =========================================================
   DIBUJAR DETECCIONES
========================================================= */


function dibujarResultados(

    resultados,

    imageWidth,

    imageHeight

) {


    if (!camaraActiva) {

        return;

    }



    const video =

        document.getElementById(
            "video"
        );



    const overlay =

        document.getElementById(
            "overlay"
        );



    overlay.width =
        video.videoWidth;


    overlay.height =
        video.videoHeight;



    const ctx =

        overlay.getContext(
            "2d"
        );



    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );



    const zona =
        obtenerZonaLectura();



    /*
    Zona amarilla.
    */

    ctx.strokeStyle =
        "#ffd600";


    ctx.lineWidth =
        4;


    ctx.setLineDash([
        20,
        12
    ]);


    ctx.strokeRect(

        zona.x,

        zona.y,

        zona.width,

        zona.height

    );


    ctx.setLineDash([]);



    /*
    Cada placa.
    */

    resultados.forEach(

        function(resultado) {


            if (!resultado.box) {

                return;

            }



            const box =
                resultado.box;



            const x =

                zona.x

                +

                (
                    Number(
                        box.xmin
                    )

                    /
                    imageWidth
                )

                *

                zona.width;



            const y =

                zona.y

                +

                (
                    Number(
                        box.ymin
                    )

                    /
                    imageHeight
                )

                *

                zona.height;



            const xmax =

                zona.x

                +

                (
                    Number(
                        box.xmax
                    )

                    /
                    imageWidth
                )

                *

                zona.width;



            const ymax =

                zona.y

                +

                (
                    Number(
                        box.ymax
                    )

                    /
                    imageHeight
                )

                *

                zona.height;



            const w =
                xmax - x;


            const h =
                ymax - y;



            const margenX =
                w * 0.12;


            const margenY =
                h * 0.30;



            const rx =

                Math.max(
                    0,
                    x - margenX
                );


            const ry =

                Math.max(
                    0,
                    y - margenY
                );


            const rw =

                w
                +
                margenX * 2;


            const rh =

                h
                +
                margenY * 2;



            /*
            Rectángulo verde.
            */

            ctx.strokeStyle =
                "#00ff55";


            ctx.lineWidth =
                7;


            ctx.strokeRect(

                rx,

                ry,

                rw,

                rh

            );



            const placa =

                formatearPlaca(
                    resultado.plate
                );



            ctx.font =
                "bold 28px Arial";



            const anchoTexto =

                ctx.measureText(
                    placa
                ).width;



            const etiquetaW =

                anchoTexto
                +
                20;



            const etiquetaH =
                40;



            const etiquetaY =

                Math.max(

                    0,

                    ry - etiquetaH

                );



            ctx.fillStyle =
                "#00ff55";


            ctx.fillRect(

                rx,

                etiquetaY,

                etiquetaW,

                etiquetaH

            );



            ctx.fillStyle =
                "#000";


            ctx.fillText(

                placa,

                rx + 10,

                etiquetaY + 29

            );

        }

    );

}



/* =========================================================
   LISTA
========================================================= */


function actualizarLista(
    resultados
) {


    const lista =

        document.getElementById(
            "listaPlacas"
        );



    if (

        resultados.length === 0

    ) {


        lista.innerHTML =
            "---";


        return;

    }



    lista.innerHTML =
        "";



    resultados.forEach(

        function(resultado) {


            const placa =

                formatearPlaca(
                    resultado.plate
                );



            const confianza =

                Math.round(

                    Number(
                        resultado.score || 0
                    )

                    *
                    100

                );



            const item =

                document.createElement(
                    "div"
                );



            item.className =
                "placaItem";



            item.innerHTML =

                "🚗 "

                +

                placa

                +

                "<div class='confianza'>"

                +

                confianza

                +

                "% confianza"

                +

                "</div>";



            lista.appendChild(
                item
            );

        }

    );

}



/* =========================================================
   CONTAR VEHICULOS
========================================================= */


function procesarVehiculos(
    resultados
) {


    const ahora =
        Date.now();



    resultados.forEach(

        function(resultado) {


            const placa =

                formatearPlaca(
                    resultado.plate
                );



            if (!placa) {

                return;

            }



            /*
            Mostrar placa principal.
            */

            document.getElementById(
                "ultimaPlaca"
            ).innerText =
                placa;



            const ultimaVez =

                historial.get(
                    placa
                )

                ||

                0;



            /*
            Contador.
            */

            if (

                ahora
                -
                ultimaVez

                >
                TIEMPO_DUPLICADO

            ) {


                totalVehiculos++;



                document.getElementById(
                    "contador"
                ).innerText =

                    totalVehiculos;

            }



            historial.set(

                placa,

                ahora

            );

        }

    );

}



/* =========================================================
   ESPERAR
========================================================= */


function esperar(
    ms
) {


    return new Promise(

        function(resolve) {


            setTimeout(
                resolve,
                ms
            );

        }

    );

}

   CAMBIO DE ORIENTACION
