<script>


/* ==========================================================
   CONFIGURACIÓN
========================================================== */


const API_URL =

"https://script.google.com/macros/s/AKfycbxbGFvAs1T4_-Aq_jYhF22G0LdS4Y9oA92lKZOzMtuB2EaObpVd1shjc6r85kw_mJaL/exec";


/*
Esperamos al menos este tiempo
después de TERMINAR una lectura
antes de enviar la siguiente.

Así evitamos saturar Snapshot.
*/

const ESPERA_ENTRE_LECTURAS =
    1200;


/*
Resolución de la zona enviada.

Más alta que la versión anterior
para leer mejor placas pequeñas.
*/

const ANCHO_ENVIO =
    1100;


const CALIDAD_JPEG =
    0.82;


/*
Máximo tiempo esperando resultado
de Apps Script.
*/

const MAX_ESPERA_RESULTADO =
    10000;


/*
Cada cuánto preguntamos
si el resultado está listo.
*/

const INTERVALO_CONSULTA =
    450;


/*
Evitar contar la misma placa
repetidamente.
*/

const TIEMPO_DUPLICADO =
    15000;



/* ==========================================================
   VARIABLES
========================================================== */


let streamCamara =
    null;


let camaraActiva =
    false;


/*
IMPORTANTE:

Mientras sea true NO se envía
otra fotografía.

Esta es una de las correcciones
principales de esta versión.
*/

let cicloOcupado =
    false;


let temporizador =
    null;


let totalVehiculos =
    0;


const historial =
    new Map();


const SESION =

    sessionStorage.getItem(
        "smartPlateSesion"
    )

    ||

    crearId();


sessionStorage.setItem(

    "smartPlateSesion",

    SESION

);



/* ==========================================================
   ID DE SESIÓN
========================================================== */


function crearId() {


    if (

        window.crypto

        &&

        crypto.randomUUID

    ) {

        return crypto.randomUUID();

    }


    return (

        Date.now()

        +

        "-"

        +

        Math.random()
            .toString(36)
            .substring(2)

    );

}



/* ==========================================================
   MENSAJES
========================================================== */


function mensaje(

    texto,

    detalle = ""

) {


    document.getElementById(
        "estado"
    ).innerText =
        texto;


    document.getElementById(
        "detalle"
    ).innerText =
        detalle;

}



function debug(
    texto
) {


    document.getElementById(
        "debug"
    ).innerText =
        texto || "";

}



/* ==========================================================
   ESTADO SERVIDOR
========================================================== */


function servidorEstado(
    estado
) {


    const punto =

        document.getElementById(
            "puntoServidor"
        );


    const texto =

        document.getElementById(
            "textoServidor"
        );


    if (estado === "on") {


        punto.style.background =
            "#00c853";


        texto.innerText =
            "ON";


    } else if (
        estado === "error"
    ) {


        punto.style.background =
            "#d50000";


        texto.innerText =
            "ERROR";


    } else {


        punto.style.background =
            "#999";


        texto.innerText =
            "...";

    }

}



/* ==========================================================
   COMPROBAR APPS SCRIPT
========================================================== */


async function comprobarServidor() {


    servidorEstado(
        "espera"
    );


    try {


        const respuesta =

            await obtenerJSONP(

                API_URL

                +

                "?accion=estado"

            );


        if (

            respuesta

            &&

            respuesta.ok

            &&

            respuesta.token_configurado

        ) {


            servidorEstado(
                "on"
            );


            mensaje(

                "✅ Servidor conectado",

                "Presiona INICIAR para comenzar."

            );


            debug(
                "Plate Recognizer configurado."
            );


        } else {


            servidorEstado(
                "error"
            );


            mensaje(

                "❌ Servidor incompleto",

                "El token de Plate Recognizer no está configurado."

            );

        }


    } catch (error) {


        servidorEstado(
            "error"
        );


        mensaje(

            "❌ No se pudo comprobar servidor",

            error.message

        );

    }

}



/* ==========================================================
   INICIAR CÁMARA
========================================================== */


async function iniciarCamara() {


    const video =

        document.getElementById(
            "video"
        );


    try {


        mensaje(

            "📷 Iniciando cámara...",

            "Permite el acceso si Android lo solicita."

        );


        streamCamara =

            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {

                            ideal:
                                "environment"

                        },

                        width: {

                            ideal:
                                1920

                        },

                        height: {

                            ideal:
                                1080

                        }

                    },

                    audio:
                        false

                });


        video.srcObject =
            streamCamara;


        await video.play();


        camaraActiva =
            true;


        cicloOcupado =
            false;


        document.getElementById(
            "btnIniciar"
        ).disabled =
            true;


        document.getElementById(
            "btnDetener"
        ).disabled =
            false;


        prepararOverlay();


        dibujarZonaLectura();


        mensaje(

            "🎯 Cámara lista",

            "Coloca la placa dentro de la zona amarilla."

        );


        /*
        Primera lectura.
        */

        temporizador =

            setTimeout(

                iniciarCiclo,

                600

            );


    } catch (error) {


        console.error(error);


        mensaje(

            "❌ No se pudo iniciar cámara",

            error.name
            +
            ": "
            +
            error.message

        );

    }

}



/* ==========================================================
   DETENER CÁMARA
========================================================== */


function detenerCamara() {


    camaraActiva =
        false;


    cicloOcupado =
        false;


    if (temporizador) {


        clearTimeout(
            temporizador
        );


        temporizador =
            null;

    }


    if (streamCamara) {


        streamCamara
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        streamCamara =
            null;

    }


    document.getElementById(
        "video"
    ).srcObject =
        null;


    limpiarOverlay();


    document.getElementById(
        "btnIniciar"
    ).disabled =
        false;


    document.getElementById(
        "btnDetener"
    ).disabled =
        true;


    mensaje(

        "⏹ Cámara detenida",

        "Presiona INICIAR para continuar."

    );

}



/* ==========================================================
   OVERLAY
========================================================== */


function prepararOverlay() {


    const video =

        document.getElementById(
            "video"
        );


    const overlay =

        document.getElementById(
            "overlay"
        );


    overlay.width =
        video.videoWidth;


    overlay.height =
        video.videoHeight;

}



/* ==========================================================
   ZONA DE LECTURA
========================================================== */


function obtenerZonaLectura() {


    const video =

        document.getElementById(
            "video"
        );


    /*
    Zona suficientemente grande
    para admitir varios carritos.

    90 % ancho
    68 % alto.
    */


    const width =

        video.videoWidth
        *
        0.90;


    const height =

        video.videoHeight
        *
        0.68;


    const x =

        (
            video.videoWidth
            -
            width
        )

        /
        2;


    /*
    La movemos ligeramente
    hacia arriba.
    */


    const y =

        (
            video.videoHeight
            -
            height
        )

        *
        0.42;


    return {

        x,

        y,

        width,

        height

    };

}



/* ==========================================================
   DIBUJAR ZONA AMARILLA
========================================================== */


function dibujarZonaLectura() {


    if (!camaraActiva) {

        return;

    }


    const overlay =

        document.getElementById(
            "overlay"
        );


    const ctx =

        overlay.getContext(
            "2d"
        );


    const zona =
        obtenerZonaLectura();


    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );


    ctx.strokeStyle =
        "#ffd600";


    ctx.lineWidth =
        5;


    ctx.setLineDash([
        20,
        12
    ]);


    ctx.strokeRect(

        zona.x,

        zona.y,

        zona.width,

        zona.height

    );


    ctx.setLineDash([]);


    ctx.fillStyle =
        "#ffd600";


    ctx.fillRect(

        zona.x,

        zona.y,

        245,

        40

    );


    ctx.fillStyle =
        "#000";


    ctx.font =
        "bold 24px Arial";


    ctx.fillText(

        "ZONA DE LECTURA",

        zona.x + 10,

        zona.y + 28

    );

}



/* ==========================================================
   LIMPIAR OVERLAY
========================================================== */


function limpiarOverlay() {


    const overlay =

        document.getElementById(
            "overlay"
        );


    const ctx =

        overlay.getContext(
            "2d"
        );


    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );

}



/* ==========================================================
   CICLO COMPLETO

   Una lectura debe TERMINAR antes
   de comenzar la siguiente.
========================================================== */


async function iniciarCiclo() {


    if (

        !camaraActiva

        ||

        cicloOcupado

    ) {

        return;

    }


    cicloOcupado =
        true;


    try {


        /*
        1. Capturar y enviar
        */

        await capturarYEnviar();


        /*
        2. Esperar resultado
        */

        const resultado =

            await esperarResultado();


        /*
        3. Procesarlo
        */

        procesarResultado(
            resultado
        );


    } catch (error) {


        console.error(error);


        mensaje(

            "❌ Error del sistema",

            error.message

        );


        servidorEstado(
            "error"
        );


    } finally {


        cicloOcupado =
            false;


        /*
        SOLO AHORA comenzamos
        a preparar otra fotografía.
        */

        if (camaraActiva) {


            temporizador =

                setTimeout(

                    iniciarCiclo,

                    ESPERA_ENTRE_LECTURAS

                );

        }

    }

}



/* ==========================================================
   CAPTURAR Y ENVIAR
========================================================== */


async function capturarYEnviar() {


    const video =

        document.getElementById(
            "video"
        );


    const canvas =

        document.getElementById(
            "captura"
        );


    const zona =
        obtenerZonaLectura();


    /*
    Mantener proporción.
    */


    const anchoDestino =

        Math.min(

            ANCHO_ENVIO,

            Math.round(
                zona.width
            )

        );


    const altoDestino =

        Math.round(

            zona.height

            /

            zona.width

            *

            anchoDestino

        );


    canvas.width =
        anchoDestino;


    canvas.height =
        altoDestino;


    const ctx =

        canvas.getContext(
            "2d"
        );


    /*
    Imagen ligeramente mejorada
    para matrícula impresa.
    */

    ctx.filter =

        "contrast(1.08) brightness(1.03)";


    ctx.drawImage(

        video,


        zona.x,

        zona.y,

        zona.width,

        zona.height,


        0,

        0,

        anchoDestino,

        altoDestino

    );


    ctx.filter =
        "none";


    const dataURL =

        canvas.toDataURL(

            "image/jpeg",

            CALIDAD_JPEG

        );


    const base64 =

        dataURL.split(
            ","
        )[1];


    mensaje(

        "📡 Enviando fotografía...",

        "Consultando Plate Recognizer."

    );


    debug(

        "JPEG "
        +
        anchoDestino
        +
        " × "
        +
        altoDestino

    );


    /*
    IMPORTANTE:

    Usamos no-cors porque Apps Script
    devuelve la respuesta mediante
    redirección de ContentService.

    No necesitamos leer este POST.

    El resultado se recuperará con
    doGet + JSONP.
    */

    await fetch(

        API_URL,

        {

            method:
                "POST",

            mode:
                "no-cors",

            headers: {

                "Content-Type":

                    "text/plain;charset=utf-8"

            },

            body:

                JSON.stringify({

                    accion:
                        "analizar",

                    sesion:
                        SESION,

                    imagen:
                        base64,

                    tipo:
                        "image/jpeg",

                    width:
                        anchoDestino,

                    height:
                        altoDestino,

                    timestamp:
                        Date.now()

                })

        }

    );


    servidorEstado(
        "on"
    );


    mensaje(

        "🧠 Reconociendo placa...",

        "Esperando resultado."

    );

}



/* ==========================================================
   ESPERAR RESULTADO DEL SERVIDOR
========================================================== */


async function esperarResultado() {


    const inicio =
        Date.now();


    while (

        camaraActiva

        &&

        Date.now() - inicio

        <
        MAX_ESPERA_RESULTADO

    ) {


        const url =

            API_URL

            +

            "?accion=resultado"

            +

            "&sesion="

            +

            encodeURIComponent(
                SESION
            )

            +

            "&t="

            +

            Date.now();


        try {


            const datos =

                await obtenerJSONP(
                    url
                );


            /*
            El servidor dice que aún
            no hay resultado.
            */


            if (

                datos

                &&

                datos.procesando

            ) {


                mensaje(

                    "🧠 Reconociendo placa...",

                    "Esperando Plate Recognizer..."

                );


                await esperar(
                    INTERVALO_CONSULTA
                );


                continue;

            }


            /*
            Tenemos resultado
            o error real.
            */


            if (datos) {

                return datos;

            }


        } catch (error) {


            console.warn(

                "Consulta temporal:",

                error

            );

        }


        await esperar(
            INTERVALO_CONSULTA
        );

    }


    throw new Error(

        "El servidor tardó demasiado en responder."

    );

}



/* ==========================================================
   JSONP

   Apps Script puede servir JavaScript
   desde ContentService.
========================================================== */


function obtenerJSONP(
    url
) {


    return new Promise(

        function(resolve, reject) {


            const callback =

                "sp_"

                +

                Date.now()

                +

                "_"

                +

                Math.floor(
                    Math.random()
                    *
                    100000
                );


            const script =

                document.createElement(
                    "script"
                );


            let terminado =
                false;


            const limpiar =
                function() {


                    try {

                        delete window[
                            callback
                        ];

                    } catch (_) {}


                    try {

                        script.remove();

                    } catch (_) {}

                };


            window[callback] =

                function(datos) {


                    if (terminado) {

                        return;

                    }


                    terminado =
                        true;


                    limpiar();


                    resolve(
                        datos
                    );

                };


            script.onerror =

                function() {


                    if (terminado) {

                        return;

                    }


                    terminado =
                        true;


                    limpiar();


                    reject(

                        new Error(
                            "No se pudo consultar Apps Script."
                        )

                    );

                };


            script.src =

                url

                +

                (
                    url.includes("?")
                    ?
                    "&"
                    :
                    "?"
                )

                +

                "callback="

                +

                encodeURIComponent(
                    callback
                );


            document.body
                .appendChild(
                    script
                );


            /*
            Tiempo máximo de cada GET.
            */

            setTimeout(

                function() {


                    if (terminado) {

                        return;

                    }


                    terminado =
                        true;


                    limpiar();


                    reject(

                        new Error(
                            "Tiempo agotado consultando servidor."
                        )

                    );

                },

                5000

            );

        }

    );

}



/* ==========================================================
   PROCESAR RESULTADO
========================================================== */


function procesarResultado(
    datos
) {


    if (!datos) {


        mensaje(

            "❌ Sin respuesta",

            "Apps Script no devolvió información."

        );


        return;

    }


    /*
    ERROR REAL
    */


    if (!datos.ok) {


        servidorEstado(
            "error"
        );


        mensaje(

            "❌ Error del detector",

            datos.error
            ||
            "Error desconocido"

        );


        debug(

            datos.http
            ?
            "HTTP: "
            +
            datos.http
            :
            ""

        );


        return;

    }


    servidorEstado(
        "on"
    );


    /*
    Tiempo total del servidor.
    */


    if (

        datos.processing_ms
        !== undefined

    ) {


        const segundos =

            Number(
                datos.processing_ms
            )

            /
            1000;


        document.getElementById(
            "tiempo"
        ).innerText =

            segundos.toFixed(1)
            +
            "s";

    }


    const resultados =

        Array.isArray(
            datos.results
        )

        ?

        datos.results

        :

        [];


    dibujarResultados(

        resultados,

        Number(
            datos.width || 1
        ),

        Number(
            datos.height || 1
        )

    );


    actualizarLista(
        resultados
    );


    procesarVehiculos(
        resultados
    );


    if (

        resultados.length === 0

    ) {


        mensaje(

            "🔎 No se encontró placa",

            "Mueve el automóvil, acércalo o mejora la iluminación."

        );


        debug(
            "Plate Recognizer respondió correctamente: 0 resultados."
        );


    } else {


        mensaje(

            "✅ "
            +
            resultados.length
            +
            (
                resultados.length === 1
                ?
                " placa detectada"
                :
                " placas detectadas"
            ),

            "Registro enviado a Google Sheets."

        );


        debug(

            "Lectura completada correctamente."

        );

    }

}



/* ==========================================================
   FORMATO DE PLACA
========================================================== */


function formatearPlaca(
    texto
) {


    if (!texto) {

        return "";
    }


    const limpio =

        String(texto)
            .toUpperCase()
            .replace(

                /[^A-Z0-9]/g,

                ""

            );


    /*
    Nuestra maqueta usa:
    ABC-123
    */


    if (

        /^[A-Z]{3}[0-9]{3}$/
        .test(limpio)

    ) {


        return (

            limpio.substring(
                0,
                3
            )

            +

            "-"

            +

            limpio.substring(
                3,
                6
            )

        );

    }


    /*
    Dejamos otros formatos
    sin destruirlos.
    */

    return limpio;

}



/* ==========================================================
   DIBUJAR RESULTADOS
========================================================== */


function dibujarResultados(

    resultados,

    imageWidth,

    imageHeight

) {


    if (!camaraActiva) {

        return;

    }


    const video =

        document.getElementById(
            "video"
        );


    const overlay =

        document.getElementById(
            "overlay"
        );


    overlay.width =
        video.videoWidth;


    overlay.height =
        video.videoHeight;


    const ctx =

        overlay.getContext(
            "2d"
        );


    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );


    const zona =
        obtenerZonaLectura();


    /*
    Zona amarilla.
    */


    ctx.strokeStyle =
        "#ffd600";


    ctx.lineWidth =
        4;


    ctx.setLineDash([
        20,
        12
    ]);


    ctx.strokeRect(

        zona.x,

        zona.y,

        zona.width,

        zona.height

    );


    ctx.setLineDash([]);


    /*
    Una caja verde por cada
    matrícula devuelta.
    */


    resultados.forEach(

        function(resultado) {


            if (!resultado.box) {

                return;

            }


            const box =
                resultado.box;


            const x =

                zona.x

                +

                (
                    Number(
                        box.xmin
                    )

                    /
                    imageWidth
                )

                *
                zona.width;


            const y =

                zona.y

                +

                (
                    Number(
                        box.ymin
                    )

                    /
                    imageHeight
                )

                *
                zona.height;


            const xmax =

                zona.x

                +

                (
                    Number(
                        box.xmax
                    )

                    /
                    imageWidth
                )

                *
                zona.width;


            const ymax =

                zona.y

                +

                (
                    Number(
                        box.ymax
                    )

                    /
                    imageHeight
                )

                *
                zona.height;


            const w =
                xmax - x;


            const h =
                ymax - y;


            /*
            Agregamos margen.
            */


            const margenX =
                w * 0.12;


            const margenY =
                h * 0.30;


            const rx =

                Math.max(
                    0,
                    x - margenX
                );


            const ry =

                Math.max(
                    0,
                    y - margenY
                );


            const rw =

                w
                +
                margenX * 2;


            const rh =

                h
                +
                margenY * 2;


            /*
            CUADRO VERDE
            */


            ctx.strokeStyle =
                "#00ff55";


            ctx.lineWidth =
                7;


            ctx.strokeRect(

                rx,

                ry,

                rw,

                rh

            );


            /*
            ETIQUETA
            */


            const placa =

                formatearPlaca(
                    resultado.plate
                );


            ctx.font =
                "bold 28px Arial";


            const anchoTexto =

                ctx.measureText(
                    placa
                ).width;


            const etiquetaW =

                anchoTexto
                +
                20;


            const etiquetaH =
                40;


            const etiquetaY =

                Math.max(

                    0,

                    ry - etiquetaH

                );


            ctx.fillStyle =
                "#00ff55";


            ctx.fillRect(

                rx,

                etiquetaY,

                etiquetaW,

                etiquetaH

            );


            ctx.fillStyle =
                "#000";


            ctx.fillText(

                placa,

                rx + 10,

                etiquetaY + 29

            );

        }

    );

}



/* ==========================================================
   LISTA DE RESULTADOS
========================================================== */


function actualizarLista(
    resultados
) {


    const lista =

        document.getElementById(
            "listaPlacas"
        );


    if (

        resultados.length === 0

    ) {


        lista.innerHTML =
            "---";


        return;

    }


    lista.innerHTML =
        "";


    resultados.forEach(

        function(resultado) {


            const placa =

                formatearPlaca(
                    resultado.plate
                );


            const confianza =

                Math.round(

                    Number(
                        resultado.score || 0
                    )

                    *
                    100

                );


            const item =

                document.createElement(
                    "div"
                );


            item.className =
                "placaItem";


            item.innerHTML =

                "🚗 "
                +
                placa

                +

                "<div class='confianza'>"

                +

                confianza

                +

                "% confianza"

                +

                "</div>";


            lista.appendChild(
                item
            );

        }

    );

}



/* ==========================================================
   CONTAR VEHÍCULOS
========================================================== */


function procesarVehiculos(
    resultados
) {


    const ahora =
        Date.now();


    resultados.forEach(

        function(resultado) {


            const placa =

                formatearPlaca(
                    resultado.plate
                );


            if (!placa) {

                return;

            }


            document.getElementById(
                "ultimaPlaca"
            ).innerText =
                placa;


            const ultimaVez =

                historial.get(
                    placa
                )

                ||

                0;


            if (

                ahora
                -
                ultimaVez

                >
                TIEMPO_DUPLICADO

            ) {


                totalVehiculos++;


                document.getElementById(
                    "contador"
                ).innerText =
                    totalVehiculos;

            }


            historial.set(

                placa,

                ahora

            );

        }

    );

}



/* ==========================================================
   ESPERAR
========================================================== */


function esperar(
    ms
) {


    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                ms
            )

    );

}

   ROTACIÓN / CAMBIO DE TAMAÑO
========================================================== */


window.addEventListener(

    "resize",

    function() {


        if (camaraActiva) {


            prepararOverlay();


            dibujarZonaLectura();

    }

);

);

comprobarServidor();
