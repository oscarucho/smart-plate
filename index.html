<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Smart Plate</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
    text-align: center;
    background: #f2f4f7;
}

h1 {
    margin-bottom: 5px;
}

.subtitulo {
    color: #666;
    margin-bottom: 15px;
}

.camara {

    position: relative;

    width: 100%;
    max-width: 750px;

    margin: auto;

    background: black;

    border-radius: 15px;

    overflow: hidden;
}

video {

    display: block;

    width: 100%;
}

#overlay {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

.botones {

    margin-top: 15px;
}

button {

    padding: 15px 22px;

    margin: 5px;

    border: none;

    border-radius: 12px;

    font-size: 17px;

    color: white;
}

#btnCamara {
    background: #1976d2;
}

#btnDetener {
    background: #d32f2f;
}

button:disabled {

    opacity: 0.5;
}

.estado {

    max-width: 750px;

    margin: 15px auto;

    padding: 15px;

    background: white;

    border-radius: 15px;
}

#mensaje {

    font-size: 19px;

    font-weight: bold;
}

.detalle {

    margin-top: 7px;

    font-size: 13px;

    color: #777;
}

.resultado {

    max-width: 750px;

    margin: 15px auto;

    padding: 20px;

    background: white;

    border-radius: 15px;
}

.tituloResultado {

    color: #555;

    font-size: 14px;
}

.placa {

    margin-top: 10px;

    font-size: 38px;

    font-weight: bold;

    letter-spacing: 5px;
}

#procesamiento {

    display: none;
}

</style>

</head>


<body>


<h1>🚗 AARÓN CARHUAYÑA SECURITY</h1>

<div class="subtitulo">
Detector inteligente de placas - Edificio Fisher 155
</div>


<div class="camara">

    <video
        id="video"
        autoplay
        playsinline
        muted
    ></video>

    <canvas id="overlay"></canvas>

</div>


<div class="botones">

    <button
        id="btnCamara"
        onclick="iniciarCamara()"
    >

        📷 INICIAR CÁMARA

    </button>


    <button
        id="btnDetener"
        onclick="detenerCamara()"
        disabled
    >

        ⏹ DETENER

    </button>

</div>


<div class="estado">

    <div id="mensaje">

        Presiona INICIAR CÁMARA

    </div>

    <div
        class="detalle"
        id="detalle"
    >

        Detector preparado

    </div>

</div>


<div class="resultado">

    <div class="tituloResultado">

        PLACA DETECTADA

    </div>

    <div
        class="placa"
        id="placa"
    >

        ---

    </div>

</div>


<!-- Canvas oculto -->

<canvas id="procesamiento"></canvas>



<script>


/* =====================================================
VARIABLES
===================================================== */

let streamCamara = null;

let camaraActiva = false;

let intervaloDetector = null;

let procesando = false;


/* Guardaremos la última detección */

let ultimaPlaca = null;

let estabilidad = 0;



/* =====================================================
MENSAJES
===================================================== */

function mostrarMensaje(texto, detalle = "") {

    document.getElementById(
        "mensaje"
    ).innerText = texto;

    document.getElementById(
        "detalle"
    ).innerText = detalle;

}



/* =====================================================
INICIAR CÁMARA
===================================================== */

async function iniciarCamara() {


    const video =
        document.getElementById(
            "video"
        );


    try {


        mostrarMensaje(

            "📷 Iniciando cámara...",

            "Permite acceso a la cámara si Android lo solicita."

        );


        streamCamara =

            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {

                        ideal: "environment"

                    },

                    width: {

                        ideal: 1280

                    },

                    height: {

                        ideal: 720

                    }

                },

                audio: false

            });



        video.srcObject =
            streamCamara;



        await video.play();



        camaraActiva =
            true;



        document.getElementById(
            "btnCamara"
        ).disabled = true;


        document.getElementById(
            "btnDetener"
        ).disabled = false;



        prepararOverlay();



        mostrarMensaje(

            "🔎 Buscando placa...",

            "Acerca el carrito y procura buena iluminación."

        );



        /*
        Detector liviano.

        No usamos OpenCV.
        */


        intervaloDetector =

            setInterval(

                analizarImagen,

                450

            );


    } catch (error) {


        console.error(error);


        mostrarMensaje(

            "❌ No se pudo iniciar la cámara",

            error.name + ": " + error.message

        );

    }

}



/* =====================================================
DETENER CÁMARA
===================================================== */

function detenerCamara() {


    camaraActiva =
        false;


    if (intervaloDetector) {

        clearInterval(
            intervaloDetector
        );

        intervaloDetector =
            null;
    }


    if (streamCamara) {


        streamCamara
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        streamCamara =
            null;

    }



    document.getElementById(
        "video"
    ).srcObject = null;



    limpiarOverlay();



    document.getElementById(
        "btnCamara"
    ).disabled = false;


    document.getElementById(
        "btnDetener"
    ).disabled = true;



    mostrarMensaje(

        "⏹ Cámara detenida",

        "Puedes volver a iniciarla."

    );

}



/* =====================================================
PREPARAR RECTÁNGULO
===================================================== */

function prepararOverlay() {


    const video =
        document.getElementById(
            "video"
        );


    const overlay =
        document.getElementById(
            "overlay"
        );


    overlay.width =
        video.videoWidth;


    overlay.height =
        video.videoHeight;

}



function limpiarOverlay() {


    const overlay =
        document.getElementById(
            "overlay"
        );


    const ctx =
        overlay.getContext("2d");


    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );

}



/* =====================================================
ANALIZAR IMAGEN

Este detector busca:

- rectángulo horizontal
- zona clara
- caracteres oscuros
- contraste con alrededor

===================================================== */

function analizarImagen() {


    if (

        !camaraActiva

        ||

        procesando

    ) {

        return;

    }



    const video =
        document.getElementById(
            "video"
        );


    if (

        !video.videoWidth

        ||

        !video.videoHeight

    ) {

        return;

    }



    procesando =
        true;


    try {


        /*
        Procesamos una imagen pequeña.

        Esto es muchísimo más liviano
        para la tablet.
        */


        const ancho =
            320;


        const alto =

            Math.round(

                video.videoHeight

                /

                video.videoWidth

                *

                ancho

            );



        const canvas =
            document.getElementById(
                "procesamiento"
            );


        canvas.width =
            ancho;


        canvas.height =
            alto;



        const ctx =

            canvas.getContext(

                "2d",

                {
                    willReadFrequently: true
                }

            );



        ctx.drawImage(

            video,

            0,

            0,

            ancho,

            alto

        );



        const imagen =

            ctx.getImageData(

                0,

                0,

                ancho,

                alto

            );



        const pixeles =
            imagen.data;



        /*
        Crear matriz de brillo
        */


        const gris =

            new Uint8Array(

                ancho * alto

            );



        for (

            let i = 0;

            i < gris.length;

            i++

        ) {


            const p =
                i * 4;


            /*
            Conversión aproximada
            RGB -> luminancia
            */


            gris[i] =

                Math.round(

                    pixeles[p] * 0.299

                    +

                    pixeles[p + 1] * 0.587

                    +

                    pixeles[p + 2] * 0.114

                );

        }



        /*
        Buscaremos ventanas horizontales.

        Probamos distintos tamaños.
        */


        const anchosPlaca = [

            60,

            75,

            90,

            110,

            130

        ];



        let mejor =
            null;


        let mejorPuntaje =
            0;



        for (

            const anchoPlaca
            of
            anchosPlaca

        ) {


            /*
            Placas aproximadamente
            2.4 a 4.5 veces más anchas
            que altas.
            */


            const alturas = [

                Math.round(
                    anchoPlaca / 2.5
                ),

                Math.round(
                    anchoPlaca / 3
                ),

                Math.round(
                    anchoPlaca / 3.5
                ),

                Math.round(
                    anchoPlaca / 4
                )

            ];



            for (

                const altoPlaca
                of
                alturas

            ) {



                for (

                    let y = 5;

                    y <
                    alto - altoPlaca - 5;

                    y += 5

                ) {



                    for (

                        let x = 5;

                        x <
                        ancho - anchoPlaca - 5;

                        x += 5

                    ) {



                        const datos =

                            analizarZona(

                                gris,

                                ancho,

                                alto,

                                x,

                                y,

                                anchoPlaca,

                                altoPlaca

                            );



                        if (!datos) {

                            continue;

                        }



                        /*
                        REGLAS

                        Zona de placa:

                        - bastante clara
                        - tiene puntos oscuros
                        - tiene contraste
                        */


                        if (

                            datos.promedio > 135

                            &&

                            datos.oscuros > 0.06

                            &&

                            datos.oscuros < 0.50

                            &&

                            datos.contraste > 35

                        ) {



                            const proporcion =

                                anchoPlaca
                                /
                                altoPlaca;



                            /*
                            Premio a proporción
                            cercana a 3.2
                            */


                            const premioForma =

                                30

                                -

                                Math.abs(

                                    proporcion
                                    -
                                    3.2

                                )
                                *
                                8;



                            const puntaje =

                                datos.promedio

                                +

                                datos.contraste * 1.5

                                +

                                datos.oscuros * 80

                                +

                                premioForma;



                            if (

                                puntaje
                                >
                                mejorPuntaje

                            ) {


                                mejorPuntaje =
                                    puntaje;


                                mejor = {

                                    x: x,

                                    y: y,

                                    width:
                                        anchoPlaca,

                                    height:
                                        altoPlaca

                                };

                            }

                        }

                    }

                }

            }

        }



        comprobarEstabilidad(

            mejor,

            ancho,

            alto

        );


    } catch (error) {


        console.error(
            error
        );


        mostrarMensaje(

            "⚠️ Detector tuvo un problema",

            error.message

        );


    } finally {


        procesando =
            false;

    }

}



/* =====================================================
ANALIZAR UNA ZONA

===================================================== */

function analizarZona(

    gris,

    anchoImagen,

    altoImagen,

    x,

    y,

    w,

    h

) {


    let suma =
        0;


    let minimo =
        255;


    let maximo =
        0;


    let oscuros =
        0;


    let total =
        0;



    /*
    No revisamos todos los pixeles.

    Saltamos de 2 en 2 para ganar velocidad.
    */


    for (

        let yy = y;

        yy < y + h;

        yy += 2

    ) {


        for (

            let xx = x;

            xx < x + w;

            xx += 2

        ) {


            const valor =

                gris[

                    yy * anchoImagen
                    +
                    xx

                ];



            suma +=
                valor;


            total++;



            if (

                valor <
                minimo

            ) {

                minimo =
                    valor;

            }



            if (

                valor >
                maximo

            ) {

                maximo =
                    valor;

            }



            /*
            Letras negras.
            */


            if (

                valor < 90

            ) {

                oscuros++;

            }

        }

    }



    if (

        total === 0

    ) {

        return null;

    }



    return {

        promedio:

            suma / total,


        oscuros:

            oscuros / total,


        contraste:

            maximo - minimo

    };

}



/* =====================================================
ESTABILIDAD

Evita que el rectángulo
salte constantemente.

===================================================== */

function comprobarEstabilidad(

    rect,

    anchoProceso,

    altoProceso

) {


    if (!rect) {


        estabilidad =
            0;


        ultimaPlaca =
            null;


        limpiarOverlay();


        mostrarMensaje(

            "🔎 Buscando placa...",

            "Coloca la placa frente a la cámara."

        );


        return;

    }



    if (

        ultimaPlaca

        &&

        Math.abs(

            ultimaPlaca.x
            -
            rect.x

        ) < 20

        &&

        Math.abs(

            ultimaPlaca.y
            -
            rect.y

        ) < 20

    ) {


        estabilidad++;


    } else {


        estabilidad =
            1;

    }



    ultimaPlaca =
        rect;



    /*
    Exigimos dos detecciones
    parecidas consecutivas.
    */


    if (

        estabilidad >= 2

    ) {


        dibujarPlaca(

            rect,

            anchoProceso,

            altoProceso

        );


    } else {


        mostrarMensaje(

            "🔍 Analizando posible placa...",

            "Mantén el carrito quieto."

        );

    }

}



/* =====================================================
DIBUJAR RECTÁNGULO VERDE
===================================================== */

function dibujarPlaca(

    rect,

    anchoProceso,

    altoProceso

) {


    const video =
        document.getElementById(
            "video"
        );


    const overlay =
        document.getElementById(
            "overlay"
        );


    overlay.width =
        video.videoWidth;


    overlay.height =
        video.videoHeight;



    const ctx =
        overlay.getContext("2d");



    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );



    const escalaX =

        video.videoWidth
        /
        anchoProceso;


    const escalaY =

        video.videoHeight
        /
        altoProceso;



    const x =

        rect.x
        *
        escalaX;


    const y =

        rect.y
        *
        escalaY;


    const w =

        rect.width
        *
        escalaX;


    const h =

        rect.height
        *
        escalaY;



    /*
    RECTÁNGULO VERDE
    */


    ctx.strokeStyle =
        "#00ff55";


    ctx.lineWidth =
        8;



    ctx.strokeRect(

        x,

        y,

        w,

        h

    );



    /*
    Fondo para texto
    */


    ctx.fillStyle =
        "#00ff55";


    ctx.fillRect(

        x,

        Math.max(
            0,
            y - 40
        ),

        160,

        40

    );



    ctx.fillStyle =
        "#000000";


    ctx.font =
        "bold 26px Arial";


    ctx.fillText(

        "PLACA",

        x + 8,

        Math.max(
            29,
            y - 10
        )

    );



    mostrarMensaje(

        "✅ Posible placa detectada",

        "Rectángulo encontrado. Próximo paso: leer BDF-456."

    );

}

</script>


</body>

</html>
