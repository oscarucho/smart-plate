<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Smart Plate</title>

<style>

* {
    box-sizing: border-box;
}

body {

    font-family: Arial, sans-serif;

    margin: 0;
    padding: 15px;

    text-align: center;

    background: #f2f4f7;
}

h1 {
    margin-bottom: 5px;
}

.subtitulo {

    color: #666;

    margin-bottom: 15px;
}

.camara {

    position: relative;

    width: 100%;
    max-width: 800px;

    margin: auto;

    background: black;

    border-radius: 15px;

    overflow: hidden;
}

video {

    display: block;

    width: 100%;
}

#overlay {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

button {

    padding: 15px 22px;

    font-size: 17px;

    border: none;

    border-radius: 12px;

    color: white;

    margin: 5px;
}

#btnCamara {
    background: #1976d2;
}

#btnDetener {
    background: #d32f2f;
}

button:disabled {
    opacity: 0.5;
}

.estado {

    max-width: 800px;

    margin: 15px auto;

    padding: 15px;

    background: white;

    border-radius: 15px;
}

#mensaje {

    font-size: 19px;

    font-weight: bold;
}

#detalle {

    margin-top: 7px;

    color: #777;

    font-size: 13px;
}

.resultado {

    max-width: 800px;

    margin: 15px auto;

    padding: 20px;

    background: white;

    border-radius: 15px;
}

#placas {

    margin-top: 12px;

    font-size: 30px;

    font-weight: bold;

    letter-spacing: 3px;
}

.placaItem {

    padding: 8px;

    margin: 5px;

    background: #e8f5e9;

    border-radius: 8px;
}

#procesamiento {
    display: none;
}

</style>

</head>


<body>


<h1>🚗 AARÓN MATHÍAS SECURITY</h1>

<div class="subtitulo">

    Detector inteligente de placas - Edificio Fisher 155

</div>


<div class="camara">

    <video
        id="video"
        autoplay
        muted
        playsinline
    ></video>

    <canvas id="overlay"></canvas>

</div>


<div>

    <button
        id="btnCamara"
        onclick="iniciarCamara()"
    >

        📷 INICIAR CÁMARA

    </button>


    <button
        id="btnDetener"
        onclick="detenerCamara()"
        disabled
    >

        ⏹ DETENER

    </button>

</div>


<div class="estado">

    <div id="mensaje">

        Presiona INICIAR CÁMARA

    </div>

    <div id="detalle">

        Esperando...

    </div>

</div>


<div class="resultado">

    <div>

        PLACAS DETECTADAS

    </div>


    <div id="placas">

        ---

    </div>

</div>


<canvas id="procesamiento"></canvas>



<script>


/* =====================================================

VARIABLES

===================================================== */

let streamCamara = null;

let camaraActiva = false;

let workerOCR = null;

let ocrListo = false;

let procesandoOCR = false;

let temporizadorOCR = null;

let cargandoTesseract = false;



/* =====================================================

MENSAJES

===================================================== */

function mensaje(texto, detalle = "") {

    document.getElementById(
        "mensaje"
    ).innerText = texto;

    document.getElementById(
        "detalle"
    ).innerText = detalle;

}



/* =====================================================

INICIAR CÁMARA

===================================================== */

async function iniciarCamara() {


    const video =
        document.getElementById("video");


    try {


        mensaje(

            "📷 Iniciando cámara...",

            "Permite acceso si Android lo solicita."

        );


        streamCamara =

            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {

                        ideal: "environment"

                    },

                    width: {

                        ideal: 1280

                    },

                    height: {

                        ideal: 720

                    }

                },

                audio: false

            });


        video.srcObject =
            streamCamara;


        await video.play();


        camaraActiva =
            true;


        document.getElementById(
            "btnCamara"
        ).disabled = true;


        document.getElementById(
            "btnDetener"
        ).disabled = false;


        prepararOverlay();


        mensaje(

            "✅ Cámara funcionando",

            "Preparando reconocimiento de placas..."

        );


        /*
        Primero cámara.

        Después cargamos OCR.
        */

        prepararTesseract();


    } catch (error) {


        console.error(error);


        mensaje(

            "❌ Error de cámara",

            error.name + ": " + error.message

        );

    }

}



/* =====================================================

DETENER CÁMARA

===================================================== */

function detenerCamara() {


    camaraActiva =
        false;


    if (temporizadorOCR) {

        clearTimeout(
            temporizadorOCR
        );

        temporizadorOCR =
            null;

    }


    if (streamCamara) {


        streamCamara
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        streamCamara =
            null;

    }


    document.getElementById(
        "video"
    ).srcObject = null;


    limpiarOverlay();


    document.getElementById(
        "btnCamara"
    ).disabled = false;


    document.getElementById(
        "btnDetener"
    ).disabled = true;


    mensaje(

        "⏹ Cámara detenida",

        "El detector OCR queda preparado."

    );

}



/* =====================================================

OVERLAY

===================================================== */

function prepararOverlay() {


    const video =
        document.getElementById("video");


    const overlay =
        document.getElementById("overlay");


    overlay.width =
        video.videoWidth;


    overlay.height =
        video.videoHeight;

}



function limpiarOverlay() {


    const overlay =
        document.getElementById("overlay");


    const ctx =
        overlay.getContext("2d");


    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );

}



/* =====================================================

CARGAR TESSERACT

===================================================== */

function prepararTesseract() {


    if (ocrListo) {

        iniciarCicloOCR();

        return;

    }


    if (cargandoTesseract) {

        return;

    }


    cargandoTesseract =
        true;


    mensaje(

        "⏳ Cargando inteligencia OCR...",

        "La cámara seguirá funcionando."

    );


    const script =
        document.createElement("script");


    /*
    Tesseract.js 7
    */

    script.src =

        "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js";


    script.onload =
        iniciarWorkerOCR;


    script.onerror =
        function() {


            cargandoTesseract =
                false;


            mensaje(

                "❌ No se pudo cargar OCR",

                "Comprueba tu conexión Wi-Fi."

            );

        };


    document.body.appendChild(
        script
    );

}



/* =====================================================

CREAR WORKER OCR

===================================================== */

async function iniciarWorkerOCR() {


    try {


        mensaje(

            "🧠 Preparando lector de placas...",

            "La primera vez puede tardar algunos segundos."

        );


        workerOCR =

            await Tesseract.createWorker(

                "eng",

                1,

                {

                    logger: function(m) {


                        if (

                            m.status ===
                            "recognizing text"

                        ) {


                            const porcentaje =

                                Math.round(

                                    m.progress * 100

                                );


                            document.getElementById(
                                "detalle"
                            ).innerText =

                                "Analizando imagen: "
                                +
                                porcentaje
                                +
                                "%";

                        }

                    }

                }

            );


        /*
        Configuración especial
        para placas.

        Solo aceptamos:

        A-Z
        0-9
        -
        */


        await workerOCR.setParameters({


            tessedit_char_whitelist:

                "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-",


            /*
            11 = SPARSE TEXT

            Busca textos dispersos
            en diferentes lugares.
            */

            tessedit_pageseg_mode:

                "11",


            preserve_interword_spaces:

                "1"

        });


        ocrListo =
            true;


        cargandoTesseract =
            false;


        mensaje(

            "✅ Detector inteligente listo",

            "Buscando placas..."

        );


        iniciarCicloOCR();


    } catch (error) {


        console.error(error);


        cargandoTesseract =
            false;


        mensaje(

            "❌ Error preparando OCR",

            error.message

        );

    }

}



/* =====================================================

CICLO OCR

===================================================== */

function iniciarCicloOCR() {


    if (!camaraActiva) {

        return;

    }


    if (temporizadorOCR) {

        clearTimeout(
            temporizadorOCR
        );

    }


    /*
    Esperamos un poco entre lecturas.

    No usamos setInterval porque nunca
    queremos ejecutar dos OCR simultáneos.
    */


    temporizadorOCR =

        setTimeout(

            analizarConOCR,

            500

        );

}



/* =====================================================

CAPTURAR Y ANALIZAR

===================================================== */

async function analizarConOCR() {


    if (

        !camaraActiva

        ||

        !ocrListo

        ||

        procesandoOCR

    ) {

        iniciarCicloOCR();

        return;

    }


    procesandoOCR =
        true;


    const video =
        document.getElementById("video");


    const canvas =
        document.getElementById(
            "procesamiento"
        );


    try {


        /*
        900px nos da bastante detalle
        sin procesar la resolución completa.
        */


        const anchoProceso =

            Math.min(

                900,

                video.videoWidth

            );


        const altoProceso =

            Math.round(

                video.videoHeight

                /

                video.videoWidth

                *

                anchoProceso

            );


        canvas.width =
            anchoProceso;


        canvas.height =
            altoProceso;


        const ctx =

            canvas.getContext(

                "2d",

                {
                    willReadFrequently: true
                }

            );


        /*
        Pequeña mejora de contraste.
        */


        ctx.filter =

            "grayscale(1) contrast(1.25)";


        ctx.drawImage(

            video,

            0,

            0,

            anchoProceso,

            altoProceso

        );


        ctx.filter =
            "none";


        mensaje(

            "🔎 Leyendo placas...",

            "Analizando letras y números."

        );


        /*
        Pedimos explícitamente BLOCKS
        para tener coordenadas.
        */


        const resultado =

            await workerOCR.recognize(

                canvas,

                {},

                {

                    text: true,

                    blocks: true

                }

            );


        const detecciones =

            extraerPlacas(

                resultado.data.blocks

            );


        dibujarDetecciones(

            detecciones,

            anchoProceso,

            altoProceso

        );


    } catch (error) {


        console.error(
            "OCR:",
            error
        );


        mensaje(

            "⚠️ Error leyendo imagen",

            error.message

        );


    } finally {


        procesandoOCR =
            false;


        /*
        Nueva lectura.

        Al esperar después de terminar
        evitamos saturar la tablet.
        */


        if (camaraActiva) {


            temporizadorOCR =

                setTimeout(

                    analizarConOCR,

                    1200

                );

        }

    }

}



/* =====================================================

EXTRAER TODAS LAS PLACAS

===================================================== */

function extraerPlacas(blocks) {


    const placas =
        [];


    if (!blocks) {

        return placas;

    }


    for (const block of blocks) {


        if (!block.paragraphs) {

            continue;

        }


        for (
            const parrafo
            of
            block.paragraphs
        ) {


            if (!parrafo.lines) {

                continue;

            }


            for (
                const linea
                of
                parrafo.lines
            ) {


                /*
                Intentamos convertir
                el texto de la línea
                en placa.
                */


                const placa =

                    normalizarPlaca(

                        linea.text

                    );


                if (!placa) {

                    continue;

                }


                /*
                Evitamos textos
                de muy baja confianza.
                */


                if (

                    typeof linea.confidence
                        === "number"

                    &&

                    linea.confidence < 25

                ) {

                    continue;

                }


                const bbox =
                    linea.bbox;


                if (!bbox) {

                    continue;

                }


                const width =

                    bbox.x1
                    -
                    bbox.x0;


                const height =

                    bbox.y1
                    -
                    bbox.y0;


                /*
                Una placa debe ser
                razonablemente horizontal.
                Permitimos bastante margen
                para ángulos.
                */


                if (

                    width < 25

                    ||

                    height < 8

                ) {

                    continue;

                }


                const proporcion =

                    width

                    /

                    Math.max(

                        height,

                        1

                    );


                if (

                    proporcion < 1.3

                    ||

                    proporcion > 9

                ) {

                    continue;

                }


                placas.push({


                    texto:
                        placa,


                    confianza:

                        linea.confidence
                        ||
                        0,


                    x:
                        bbox.x0,


                    y:
                        bbox.y0,


                    width:
                        width,


                    height:
                        height

                });

            }

        }

    }


    return eliminarDuplicados(
        placas
    );

}



/* =====================================================

NORMALIZAR PLACA

Formato esperado:

ABC-123

También acepta:

ABC123

===================================================== */

function normalizarPlaca(texto) {


    if (!texto) {

        return null;

    }


    let t =

        texto
        .toUpperCase()
        .replace(
            /[–—_]/g,
            "-"
        )
        .replace(
            /[^A-Z0-9-]/g,
            ""
        );


    /*
    Quitamos guión temporalmente.
    */


    t =
        t.replace(
            /-/g,
            ""
        );


    /*
    Nuestro experimento usa:

    3 letras + 3 números
    */


    if (t.length !== 6) {

        return null;

    }


    let letras =

        t.substring(
            0,
            3
        );


    let numeros =

        t.substring(
            3,
            6
        );



    /*
    Correcciones comunes de OCR
    en zona de letras.
    */


    letras =

        letras
        .replace(/0/g, "O")
        .replace(/1/g, "I")
        .replace(/5/g, "S")
        .replace(/8/g, "B");



    /*
    Correcciones comunes en números.
    */


    numeros =

        numeros
        .replace(/[OQD]/g, "0")
        .replace(/[IL]/g, "1")
        .replace(/Z/g, "2")
        .replace(/S/g, "5")
        .replace(/G/g, "6")
        .replace(/B/g, "8");



    if (

        !/^[A-Z]{3}$/.test(
            letras
        )

    ) {

        return null;

    }


    if (

        !/^[0-9]{3}$/.test(
            numeros
        )

    ) {

        return null;

    }


    return (

        letras

        +

        "-"

        +

        numeros

    );

}



/* =====================================================

ELIMINAR DUPLICADOS

===================================================== */

function eliminarDuplicados(lista) {


    const resultado =
        [];


    for (const placa of lista) {


        let repetida =
            false;


        for (
            const existente
            of
            resultado
        ) {


            if (

                existente.texto
                ===
                placa.texto

            ) {


                repetida =
                    true;


                /*
                Nos quedamos con la
                detección más confiable.
                */


                if (

                    placa.confianza
                    >
                    existente.confianza

                ) {


                    Object.assign(

                        existente,

                        placa

                    );

                }


                break;

            }

        }


        if (!repetida) {

            resultado.push(
                placa
            );

        }

    }


    return resultado;

}



/* =====================================================

DIBUJAR TODAS LAS PLACAS

===================================================== */

function dibujarDetecciones(

    placas,

    anchoProceso,

    altoProceso

) {


    const video =
        document.getElementById("video");


    const overlay =
        document.getElementById("overlay");


    overlay.width =
        video.videoWidth;


    overlay.height =
        video.videoHeight;


    const ctx =
        overlay.getContext("2d");


    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );


    if (

        !placas

        ||

        placas.length === 0

    ) {


        document.getElementById(
            "placas"
        ).innerText = "---";


        mensaje(

            "🔎 Buscando placas...",

            "Acerca los vehículos o mejora la iluminación."

        );


        return;

    }


    const escalaX =

        video.videoWidth

        /

        anchoProceso;


    const escalaY =

        video.videoHeight

        /

        altoProceso;



    /*
    DIBUJAMOS CADA PLACA
    */


    placas.forEach(

        (placa, indice) => {


            const x =

                placa.x
                *
                escalaX;


            const y =

                placa.y
                *
                escalaY;


            const width =

                placa.width
                *
                escalaX;


            const height =

                placa.height
                *
                escalaY;



            /*
            Añadimos margen.
            */


            const margenX =
                width * 0.12;


            const margenY =
                height * 0.35;



            ctx.strokeStyle =
                "#00ff55";


            ctx.lineWidth =
                7;


            ctx.strokeRect(

                x - margenX,

                y - margenY,

                width
                +
                margenX * 2,

                height
                +
                margenY * 2

            );



            /*
            ETIQUETA
            */


            ctx.font =
                "bold 28px Arial";


            const texto =
                placa.texto;


            const medida =
                ctx.measureText(
                    texto
                );


            const etiquetaWidth =
                medida.width + 20;


            const etiquetaY =

                Math.max(

                    0,

                    y
                    -
                    margenY
                    -
                    40

                );


            ctx.fillStyle =
                "#00ff55";


            ctx.fillRect(

                x - margenX,

                etiquetaY,

                etiquetaWidth,

                38

            );


            ctx.fillStyle =
                "#000";


            ctx.fillText(

                texto,

                x
                -
                margenX
                +
                10,

                etiquetaY
                +
                28

            );

        }

    );



    /*
    MOSTRAR LISTA ABAJO
    */


    const contenedor =

        document.getElementById(
            "placas"
        );


    contenedor.innerHTML =
        "";


    placas.forEach(

        placa => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "placaItem";


            div.innerText =

                "🚗 "
                +
                placa.texto;


            contenedor.appendChild(
                div
            );

        }

    );


    mensaje(

        "✅ "
        +
        placas.length
        +
        (
            placas.length === 1
            ?
            " placa detectada"
            :
            " placas detectadas"
        ),

        "OCR completado correctamente."

    );

}



/* =====================================================

AL SALIR

===================================================== */

window.addEventListener(

    "beforeunload",

    function() {


        if (workerOCR) {

            workerOCR.terminate();

        }

    }

);


</script>


</body>

</html>
