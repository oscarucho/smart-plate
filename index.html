<script>


/* ==========================================================
CONFIGURACIÓN
========================================================== */


/*
PEGA AQUÍ LA URL /exec
QUE TE DIO GOOGLE APPS SCRIPT
*/

const APPS_SCRIPT_URL =

  "https://script.google.com/macros/s/AKfycbxbGFvAs1T4_-Aq_jYhF22G0LdS4Y9oA92lKZOzMtuB2EaObpVd1shjc6r85kw_mJaL/exec";


/*
Debe ser igual al token
del Apps Script.
*/

const TOKEN_REGISTRO =

  "SMARTPLATE-2026";


/*
No volveremos a guardar la misma placa
durante 30 segundos.
*/

const TIEMPO_REPETIDO =

  30000;


/*
Máximo de regiones que vamos
a analizar simultáneamente.
*/

const MAX_CANDIDATOS =

  8;



/* ==========================================================
VARIABLES
========================================================== */

let streamCamara = null;

let camaraActiva = false;

let workerOCR = null;

let ocrListo = false;

let analizando = false;

let timerOCR = null;

let cargandoOCR = false;


/*
Historial temporal para confirmar
una placa antes de guardarla.
*/

const memoriaPlacas =
  new Map();


/*
Una identificación para esta sesión.
*/

const SESION =

  sessionStorage.getItem(
    "smartPlateSesion"
  )

  ||

  crearSesion();


sessionStorage.setItem(
  "smartPlateSesion",
  SESION
);



/* ==========================================================
SESIÓN
========================================================== */

function crearSesion() {

  if (

    window.crypto

    &&

    crypto.randomUUID

  ) {

    return crypto.randomUUID();

  }


  return (

    Date.now()

    +

    "-"

    +

    Math.random()
      .toString(36)
      .substring(2)

  );

}



/* ==========================================================
MENSAJES
========================================================== */

function mensaje(

  texto,

  detalle = ""

) {

  document.getElementById(
    "estado"
  ).innerText = texto;


  document.getElementById(
    "detalle"
  ).innerText = detalle;

}



/* ==========================================================
CÁMARA
========================================================== */

async function iniciarCamara() {


  const video =
    document.getElementById(
      "video"
    );


  try {


    mensaje(

      "📷 Iniciando cámara...",

      "Permite el acceso si Android lo solicita."

    );


    streamCamara =

      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {

              ideal:
                "environment"

            },

            width: {

              ideal: 1920

            },

            height: {

              ideal: 1080

            }

          },

          audio: false

        });


    video.srcObject =
      streamCamara;


    await video.play();


    camaraActiva =
      true;


    document.getElementById(
      "btnIniciar"
    ).disabled = true;


    document.getElementById(
      "btnDetener"
    ).disabled = false;


    prepararOverlay();


    mensaje(

      "✅ Cámara lista",

      "Preparando reconocimiento OCR..."

    );


    cargarTesseract();


  } catch (error) {


    console.error(error);


    mensaje(

      "❌ Error al iniciar cámara",

      error.name
      +
      ": "
      +
      error.message

    );

  }

}



function detenerCamara() {


  camaraActiva =
    false;


  if (timerOCR) {

    clearTimeout(
      timerOCR
    );

    timerOCR =
      null;

  }


  if (streamCamara) {


    streamCamara
      .getTracks()
      .forEach(

        track =>
          track.stop()

      );


    streamCamara =
      null;

  }


  document.getElementById(
    "video"
  ).srcObject = null;


  limpiarOverlay();


  document.getElementById(
    "btnIniciar"
  ).disabled = false;


  document.getElementById(
    "btnDetener"
  ).disabled = true;


  mensaje(

    "⏹ Cámara detenida",

    "Puedes volver a iniciarla."

  );

}



/* ==========================================================
OVERLAY
========================================================== */

function prepararOverlay() {


  const video =
    document.getElementById(
      "video"
    );


  const overlay =
    document.getElementById(
      "overlay"
    );


  overlay.width =
    video.videoWidth;


  overlay.height =
    video.videoHeight;

}



function limpiarOverlay() {


  const overlay =
    document.getElementById(
      "overlay"
    );


  const ctx =
    overlay.getContext("2d");


  ctx.clearRect(

    0,

    0,

    overlay.width,

    overlay.height

  );

}



/* ==========================================================
TESSERACT
========================================================== */

function cargarTesseract() {


  if (ocrListo) {

    programarAnalisis();

    return;

  }


  if (cargandoOCR) {

    return;

  }


  cargandoOCR =
    true;


  mensaje(

    "⏳ Cargando OCR...",

    "La primera carga puede tomar unos segundos."

  );


  if (window.Tesseract) {

    crearWorkerOCR();

    return;

  }


  const script =
    document.createElement(
      "script"
    );


  script.src =

    "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js";


  script.onload =
    crearWorkerOCR;


  script.onerror =
    function () {


      cargandoOCR =
        false;


      mensaje(

        "❌ No se pudo cargar OCR",

        "Comprueba la conexión Wi-Fi."

      );

    };


  document.body.appendChild(
    script
  );

}



async function crearWorkerOCR() {


  try {


    mensaje(

      "🧠 Preparando lector...",

      "Configurando reconocimiento de placas."

    );


    workerOCR =

      await Tesseract.createWorker(

        "eng",

        1,

        {

          logger: function(m) {


            if (

              m.status ===
              "recognizing text"

            ) {


              const porcentaje =

                Math.round(
                  m.progress * 100
                );


              document.getElementById(
                "detalle"
              ).innerText =

                "OCR: "
                +
                porcentaje
                +
                "%";

            }

          }

        }

      );


    await workerOCR.setParameters({

      tessedit_char_whitelist:

        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-",


      /*
      11 = texto disperso.
      */

      tessedit_pageseg_mode:

        "11",


      preserve_interword_spaces:

        "1",


      user_defined_dpi:

        "300"

    });


    ocrListo =
      true;


    cargandoOCR =
      false;


    mensaje(

      "✅ Detector listo",

      "Buscando varias placas..."

    );


    programarAnalisis();


  } catch (error) {


    console.error(error);


    cargandoOCR =
      false;


    mensaje(

      "❌ Error preparando OCR",

      error.message

    );

  }

}



/* ==========================================================
CICLO
========================================================== */

function programarAnalisis() {


  if (!camaraActiva) {

    return;

  }


  if (timerOCR) {

    clearTimeout(
      timerOCR
    );

  }


  timerOCR =

    setTimeout(

      analizarEscena,

      800

    );

}



/* ==========================================================
ANALIZAR ESCENA
========================================================== */

async function analizarEscena() {


  if (

    !camaraActiva

    ||

    !ocrListo

    ||

    analizando

  ) {

    programarAnalisis();

    return;

  }


  analizando =
    true;


  try {


    /*
    PASO 1:
    encontrar varias zonas
    que parecen placas.
    */


    const resultadoBusqueda =

      detectarCandidatos();


    const candidatos =

      resultadoBusqueda
        .candidatos;


    if (

      candidatos.length === 0

    ) {


      limpiarOverlay();


      mostrarPlacas([]);


      mensaje(

        "🔎 Buscando placas...",

        "Acerca los vehículos o mejora la iluminación."

      );


      return;

    }


    mensaje(

      "🔍 Analizando "
      +
      candidatos.length
      +
      " zonas...",

      "Ampliando placas antes del OCR."

    );


    /*
    PASO 2:
    crear una imagen grande
    con todas las regiones.
    */


    const montaje =

      crearMontajeOCR(

        candidatos,

        resultadoBusqueda
          .ancho,

        resultadoBusqueda
          .alto

      );


    /*
    PASO 3:
    un único OCR sobre
    todas las placas ampliadas.
    */


    const resultadoOCR =

      await workerOCR.recognize(

        montaje.canvas,

        {},

        {

          text: true,

          blocks: true

        }

      );


    /*
    PASO 4:
    relacionar cada texto
    con su carrito.
    */


    let detecciones =

      interpretarOCR(

        resultadoOCR.data.blocks,

        montaje.filas,

        montaje.rowHeight

      );


    /*
    Eliminar duplicados.
    */

    detecciones =

      eliminarDuplicadosTexto(
        detecciones
      );


    dibujarDetecciones(
      detecciones
    );


    mostrarPlacas(
      detecciones
    );


    procesarRegistros(
      detecciones
    );


    if (

      detecciones.length > 0

    ) {


      mensaje(

        "✅ "
        +
        detecciones.length
        +
        (
          detecciones.length === 1
            ?
            " placa detectada"
            :
            " placas detectadas"
        ),

        "Confirmando y registrando resultados."

      );


    } else {


      mensaje(

        "🔎 Buscando placas...",

        "Se encontraron zonas, pero el OCR todavía no confirmó texto."

      );

    }


  } catch (error) {


    console.error(error);


    mensaje(

      "⚠️ Error de análisis",

      error.message

    );


  } finally {


    analizando =
      false;


    if (camaraActiva) {


      timerOCR =

        setTimeout(

          analizarEscena,

          1200

        );

    }

  }

}



/* ==========================================================
DETECTOR DE CANDIDATOS

Busca múltiples zonas claras
con caracteres oscuros.
========================================================== */

function detectarCandidatos() {


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvasAnalisis"
    );


  const ancho =
    420;


  const alto =

    Math.round(

      video.videoHeight

      /

      video.videoWidth

      *

      ancho

    );


  canvas.width =
    ancho;


  canvas.height =
    alto;


  const ctx =

    canvas.getContext(

      "2d",

      {
        willReadFrequently: true
      }

    );


  ctx.drawImage(

    video,

    0,

    0,

    ancho,

    alto

  );


  const imageData =

    ctx.getImageData(

      0,

      0,

      ancho,

      alto

    );


  const datos =
    imageData.data;


  const gris =

    new Uint8Array(
      ancho * alto
    );


  for (

    let i = 0;

    i < gris.length;

    i++

  ) {


    const p =
      i * 4;


    gris[i] =

      Math.round(

        datos[p] * 0.299

        +

        datos[p + 1] * 0.587

        +

        datos[p + 2] * 0.114

      );

  }


  const integrales =

    crearIntegrales(

      gris,

      ancho,

      alto

    );


  const posibles =
    [];


  /*
  Tamaños para placas
  pequeñas y grandes.
  */

  const anchos = [

    28,
    36,
    46,
    58,
    72,
    90,
    112,
    138

  ];


  const proporciones = [

    2.3,
    2.8,
    3.3,
    3.8,
    4.4

  ];


  for (

    const w
    of
    anchos

  ) {


    for (

      const ratio
      of
      proporciones

    ) {


      const h =

        Math.max(

          12,

          Math.round(
            w / ratio
          )

        );


      if (

        w >= ancho

        ||

        h >= alto

      ) {

        continue;

      }


      const paso =

        Math.max(

          4,

          Math.round(
            w / 13
          )

        );


      for (

        let y = 2;

        y <= alto - h - 2;

        y += paso

      ) {


        for (

          let x = 2;

          x <= ancho - w - 2;

          x += paso

        ) {


          const area =
            w * h;


          const suma =

            sumaRect(

              integrales.suma,

              x,
              y,
              w,
              h,

              integrales.stride

            );


          const cantidadOscuros =

            sumaRect(

              integrales.oscuros,

              x,
              y,
              w,
              h,

              integrales.stride

            );


          const bordes =

            sumaRect(

              integrales.bordes,

              x,
              y,
              w,
              h,

              integrales.stride

            );


          const promedio =

            suma / area;


          const oscuros =

            cantidadOscuros
            /
            area;


          const energiaBordes =

            bordes
            /
            area;


          /*
          Zona clara + letras oscuras
          + suficientes bordes.
          */

          if (

            promedio < 105

            ||

            promedio > 250

            ||

            oscuros < 0.035

            ||

            oscuros > 0.45

            ||

            energiaBordes < 5

          ) {

            continue;

          }


          const premioOscuros =

            Math.max(

              0,

              1

              -

              Math.abs(
                oscuros - 0.18
              )

              /
              0.18

            );


          const puntaje =

            energiaBordes * 4

            +

            premioOscuros * 75

            +

            promedio * 0.12

            -

            Math.abs(
              ratio - 3.3
            ) * 5;


          posibles.push({

            x: x,

            y: y,

            width: w,

            height: h,

            score:
              puntaje

          });

        }

      }

    }

  }


  posibles.sort(

    (a, b) =>
      b.score - a.score

  );


  return {

    ancho: ancho,

    alto: alto,

    candidatos:

      seleccionarCandidatos(
        posibles
      )

  };

}



/* ==========================================================
IMÁGENES INTEGRALES
========================================================== */

function crearIntegrales(

  gris,

  ancho,

  alto

) {


  const stride =
    ancho + 1;


  const tamano =

    (ancho + 1)

    *

    (alto + 1);


  const suma =

    new Float64Array(
      tamano
    );


  const oscuros =

    new Uint32Array(
      tamano
    );


  const bordes =

    new Float64Array(
      tamano
    );


  for (

    let y = 1;

    y <= alto;

    y++

  ) {


    let filaSuma =
      0;


    let filaOscuros =
      0;


    let filaBordes =
      0;


    for (

      let x = 1;

      x <= ancho;

      x++

    ) {


      const indice =

        (y - 1)
        *
        ancho

        +

        (x - 1);


      const valor =
        gris[indice];


      filaSuma +=
        valor;


      filaOscuros +=

        valor < 105
          ?
          1
          :
          0;


      let borde =
        0;


      if (x > 1) {


        borde =

          Math.abs(

            valor

            -

            gris[
              indice - 1
            ]

          );

      }


      filaBordes +=
        borde;


      const pos =

        y * stride
        +
        x;


      suma[pos] =

        suma[
          pos - stride
        ]

        +

        filaSuma;


      oscuros[pos] =

        oscuros[
          pos - stride
        ]

        +

        filaOscuros;


      bordes[pos] =

        bordes[
          pos - stride
        ]

        +

        filaBordes;

    }

  }


  return {

    suma,

    oscuros,

    bordes,

    stride

  };

}



function sumaRect(

  integral,

  x,

  y,

  w,

  h,

  stride

) {


  const x1 =
    x;


  const y1 =
    y;


  const x2 =
    x + w;


  const y2 =
    y + h;


  return (

    integral[
      y2 * stride + x2
    ]

    -

    integral[
      y1 * stride + x2
    ]

    -

    integral[
      y2 * stride + x1
    ]

    +

    integral[
      y1 * stride + x1
    ]

  );

}



/* ==========================================================
QUITAR RECTÁNGULOS REPETIDOS
========================================================== */

function seleccionarCandidatos(

  lista

) {


  const resultado =
    [];


  for (

    const candidato
    of
    lista

  ) {


    let repetido =
      false;


    for (

      const seleccionado
      of
      resultado

    ) {


      if (

        calcularIoU(

          candidato,

          seleccionado

        )

        >
        0.30

      ) {


        repetido =
          true;

        break;

      }

    }


    if (!repetido) {


      resultado.push(
        candidato
      );

    }


    if (

      resultado.length
      >=
      MAX_CANDIDATOS

    ) {

      break;

    }

  }


  return resultado;

}



function calcularIoU(

  a,

  b

) {


  const x1 =

    Math.max(
      a.x,
      b.x
    );


  const y1 =

    Math.max(
      a.y,
      b.y
    );


  const x2 =

    Math.min(

      a.x + a.width,

      b.x + b.width

    );


  const y2 =

    Math.min(

      a.y + a.height,

      b.y + b.height

    );


  const interW =

    Math.max(
      0,
      x2 - x1
    );


  const interH =

    Math.max(
      0,
      y2 - y1
    );


  const inter =

    interW
    *
    interH;


  if (inter <= 0) {

    return 0;

  }


  const areaA =

    a.width
    *
    a.height;


  const areaB =

    b.width
    *
    b.height;


  return (

    inter

    /

    (
      areaA
      +
      areaB
      -
      inter
    )

  );

}



/* ==========================================================
CREAR MONTAJE OCR

Cada posible placa se amplía.
========================================================== */

function crearMontajeOCR(

  candidatos,

  anchoAnalisis,

  altoAnalisis

) {


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvasOCR"
    );


  const width =
    600;


  const rowHeight =
    175;


  canvas.width =
    width;


  canvas.height =

    candidatos.length
    *
    rowHeight;


  const ctx =

    canvas.getContext(
      "2d"
    );


  ctx.fillStyle =
    "white";


  ctx.fillRect(

    0,

    0,

    canvas.width,

    canvas.height

  );


  const escalaX =

    video.videoWidth

    /

    anchoAnalisis;


  const escalaY =

    video.videoHeight

    /

    altoAnalisis;


  const filas =
    [];


  candidatos.forEach(

    (candidato, indice) => {


      let x =

        candidato.x
        *
        escalaX;


      let y =

        candidato.y
        *
        escalaY;


      let w =

        candidato.width
        *
        escalaX;


      let h =

        candidato.height
        *
        escalaY;


      /*
      Añadir margen alrededor.
      */

      const margenX =

        w * 0.15;


      const margenY =

        h * 0.45;


      x =
        Math.max(
          0,
          x - margenX
        );


      y =
        Math.max(
          0,
          y - margenY
        );


      w =
        Math.min(

          video.videoWidth - x,

          w + margenX * 2

        );


      h =
        Math.min(

          video.videoHeight - y,

          h + margenY * 2

        );


      /*
      AGRANDAR.
      */

      const factor =

        Math.min(

          560 / w,

          130 / h

        );


      const destinoW =

        w * factor;


      const destinoH =

        h * factor;


      const destinoX =

        (
          width
          -
          destinoW
        )
        /
        2;


      const destinoY =

        indice
        *
        rowHeight

        +

        (
          rowHeight
          -
          destinoH
        )
        /
        2;


      ctx.filter =

        "grayscale(1) contrast(2.0) brightness(1.1)";


      ctx.drawImage(

        video,

        x,
        y,
        w,
        h,

        destinoX,
        destinoY,
        destinoW,
        destinoH

      );


      ctx.filter =
        "none";


      /*
      Línea para separar candidatos.
      */

      ctx.fillStyle =
        "#dddddd";


      ctx.fillRect(

        0,

        indice
        *
        rowHeight,

        width,

        2

      );


      filas.push({

        indice:
          indice,

        x:
          x,

        y:
          y,

        width:
          w,

        height:
          h

      });

    }

  );


  return {

    canvas,

    filas,

    rowHeight

  };

}



/* ==========================================================
INTERPRETAR OCR
========================================================== */

function interpretarOCR(

  blocks,

  filas,

  rowHeight

) {


  const resultado =
    [];


  if (!blocks) {

    return resultado;

  }


  const mejores =
    new Map();


  for (

    const block
    of
    blocks

  ) {


    if (!block.paragraphs) {

      continue;

    }


    for (

      const paragraph
      of
      block.paragraphs

    ) {


      if (!paragraph.lines) {

        continue;

      }


      for (

        const line
        of
        paragraph.lines

      ) {


        const placa =

          normalizarPlaca(
            line.text
          );


        if (!placa) {

          continue;

        }


        if (!line.bbox) {

          continue;

        }


        const confianza =

          Number(
            line.confidence || 0
          );


        /*
        Permitimos una confianza baja
        porque después exigimos repetición.
        */

        if (confianza < 15) {

          continue;

        }


        const centroY =

          (
            line.bbox.y0
            +
            line.bbox.y1
          )
          /
          2;


        const fila =

          Math.floor(

            centroY
            /
            rowHeight

          );


        if (

          fila < 0

          ||

          fila >= filas.length

        ) {

          continue;

        }


        const actual =

          mejores.get(
            fila
          );


        if (

          !actual

          ||

          confianza
          >
          actual.confianza

        ) {


          mejores.set(

            fila,

            {

              texto:
                placa,

              confianza:
                confianza,

              rect:
                filas[fila]

            }

          );

        }

      }

    }

  }


  for (

    const dato
    of
    mejores.values()

  ) {

    resultado.push(
      dato
    );

  }


  return resultado;

}



/* ==========================================================
NORMALIZAR PLACA
========================================================== */

function normalizarPlaca(

  texto

) {


  if (!texto) {

    return null;

  }


  let limpio =

    String(texto)
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      );


  if (

    limpio.length < 6

  ) {

    return null;

  }


  /*
  Probamos grupos de 6 caracteres.
  */

  for (

    let inicio = 0;

    inicio <= limpio.length - 6;

    inicio++

  ) {


    const grupo =

      limpio.substring(

        inicio,

        inicio + 6

      );


    let letras =

      grupo.substring(
        0,
        3
      );


    let numeros =

      grupo.substring(
        3,
        6
      );


    /*
    Errores típicos
    en la parte de letras.
    */

    letras =

      letras
        .replace(/0/g, "O")
        .replace(/1/g, "I")
        .replace(/5/g, "S")
        .replace(/8/g, "B");


    /*
    Errores típicos
    en la parte numérica.
    */

    numeros =

      numeros
        .replace(/[OQD]/g, "0")
        .replace(/[IL]/g, "1")
        .replace(/Z/g, "2")
        .replace(/S/g, "5")
        .replace(/G/g, "6")
        .replace(/B/g, "8");


    if (

      /^[A-Z]{3}$/.test(
        letras
      )

      &&

      /^[0-9]{3}$/.test(
        numeros
      )

    ) {


      return (

        letras

        +

        "-"

        +

        numeros

      );

    }

  }


  return null;

}



/* ==========================================================
ELIMINAR PLACAS REPETIDAS
EN LA MISMA IMAGEN
========================================================== */

function eliminarDuplicadosTexto(

  detecciones

) {


  const mapa =
    new Map();


  detecciones.forEach(

    deteccion => {


      const anterior =

        mapa.get(
          deteccion.texto
        );


      if (

        !anterior

        ||

        deteccion.confianza
        >
        anterior.confianza

      ) {


        mapa.set(

          deteccion.texto,

          deteccion

        );

      }

    }

  );


  return Array.from(
    mapa.values()
  );

}



/* ==========================================================
DIBUJAR RECTÁNGULOS
========================================================== */

function dibujarDetecciones(

  detecciones

) {


  const video =
    document.getElementById(
      "video"
    );


  const overlay =
    document.getElementById(
      "overlay"
    );


  overlay.width =
    video.videoWidth;


  overlay.height =
    video.videoHeight;


  const ctx =
    overlay.getContext(
      "2d"
    );


  ctx.clearRect(

    0,

    0,

    overlay.width,

    overlay.height

  );


  detecciones.forEach(

    deteccion => {


      const r =
        deteccion.rect;


      ctx.strokeStyle =
        "#00ff55";


      ctx.lineWidth =
        7;


      ctx.strokeRect(

        r.x,

        r.y,

        r.width,

        r.height

      );


      ctx.font =

        "bold 26px Arial";


      const medida =

        ctx.measureText(
          deteccion.texto
        );


      const etiquetaW =

        medida.width
        +
        18;


      const etiquetaY =

        Math.max(

          0,

          r.y - 38

        );


      ctx.fillStyle =
        "#00ff55";


      ctx.fillRect(

        r.x,

        etiquetaY,

        etiquetaW,

        36

      );


      ctx.fillStyle =
        "#000";


      ctx.fillText(

        deteccion.texto,

        r.x + 8,

        etiquetaY + 27

      );

    }

  );

}



/* ==========================================================
MOSTRAR PLACAS
========================================================== */

function mostrarPlacas(

  detecciones

) {


  const contenedor =

    document.getElementById(
      "listaPlacas"
    );


  if (

    detecciones.length === 0

  ) {


    contenedor.innerHTML =
      "<br>---";


    return;

  }


  contenedor.innerHTML =
    "";


  detecciones.forEach(

    dato => {


      const item =

        document.createElement(
          "div"
        );


      item.className =
        "placa";


      const confianza =

        Math.round(
          dato.confianza
        );


      item.innerHTML =

        "🚗 "
        +
        dato.texto

        +

        "<div class='guardado'>"

        +

        confianza

        +

        "% confianza"

        +

        "</div>";


      contenedor.appendChild(
        item
      );

    }

  );

}



/* ==========================================================
CONFIRMAR Y GUARDAR
========================================================== */

function procesarRegistros(

  detecciones

) {


  const ahora =
    Date.now();


  detecciones.forEach(

    deteccion => {


      let memoria =

        memoriaPlacas.get(
          deteccion.texto
        );


      if (!memoria) {


        memoria = {

          veces: 0,

          ultimaVista: 0,

          ultimoGuardado: 0

        };

      }


      /*
      Si apareció recientemente,
      incrementamos confirmaciones.
      */

      if (

        ahora
        -
        memoria.ultimaVista

        <
        8000

      ) {


        memoria.veces++;


      } else {


        memoria.veces =
          1;

      }


      memoria.ultimaVista =
        ahora;


      /*
      Debe ser vista al menos
      dos veces para guardarla.
      */

      if (

        memoria.veces >= 2

        &&

        ahora
        -
        memoria.ultimoGuardado

        >
        TIEMPO_REPETIDO

      ) {


        memoria.ultimoGuardado =
          ahora;


        guardarEnGoogleSheets(

          deteccion.texto,

          deteccion.confianza

        );

      }


      memoriaPlacas.set(

        deteccion.texto,

        memoria

      );

    }

  );

}



/* ==========================================================
GOOGLE SHEETS
========================================================== */

async function guardarEnGoogleSheets(

  placa,

  confianza

) {


  /*
  Mientras no configures
  Apps Script no intentamos guardar.
  */

  if (

    !APPS_SCRIPT_URL

    ||

    APPS_SCRIPT_URL.includes(
      "PEGA_AQUI"
    )

  ) {


    console.log(

      "Google Sheets todavía no configurado."

    );


    return;

  }


  const datos = {

    token:
      TOKEN_REGISTRO,

    placa:
      placa,

    confianza:

      Math.round(
        confianza
      ),

    sesion:
      SESION,

    origen:
      "Smart Plate Web",

    dispositivo:

      navigator.userAgent
        .substring(
          0,
          150
        )

  };


  try {


    /*
    no-cors permite enviar el registro
    desde GitHub Pages al Apps Script.

    No necesitamos leer la respuesta.
    */


    await fetch(

      APPS_SCRIPT_URL,

      {

        method:
          "POST",

        mode:
          "no-cors",

        headers: {

          "Content-Type":

            "text/plain;charset=utf-8"

        },

        body:

          JSON.stringify(
            datos
          ),

        keepalive:
          true

      }

    );


    console.log(

      "Registro enviado:",

      placa

    );


  } catch (error) {


    console.error(

      "Error guardando:",

      error

    );

  }

}



/* ==========================================================
CERRAR OCR
========================================================== */

window.addEventListener(

  "beforeunload",

  function () {


    if (workerOCR) {

      workerOCR.terminate();

    }

  }

);
