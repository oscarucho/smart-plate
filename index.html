<!-- =====================================================

CANVAS OCULTO

Aquí convertimos una parte de la cámara a JPEG.

===================================================== -->


<canvas id="captura"></canvas>



<script>


/* =========================================================

CONFIGURACIÓN

========================================================= */


/*
Tu Google Apps Script real.
*/

const API_URL =

"https://script.google.com/macros/s/AKfycbxbGFvAs1T4_-Aq_jYhF22G0LdS4Y9oA92lKZOzMtuB2EaObpVd1shjc6r85kw_mJaL/exec";



/*
Cada cuánto enviamos una imagen.

Plate Recognizer Free Trial
permite 1 lookup por segundo.

Usamos 1300 ms para tener margen.
*/

const INTERVALO_CAPTURA =
    1300;



/*
Calidad JPEG.

0.75 = buena calidad
sin generar imágenes demasiado grandes.
*/

const CALIDAD_JPEG =
    0.75;



/*
Ancho máximo de imagen enviada.

No necesitamos enviar 1920 px completos.
*/

const ANCHO_ENVIO =
    900;



/*
Tiempo durante el cual una placa
no se vuelve a contar como vehículo nuevo.
*/

const TIEMPO_DUPLICADO =
    15000;



/* =========================================================

VARIABLES

========================================================= */

let streamCamara =
    null;


let camaraActiva =
    false;


let procesando =
    false;


let temporizador =
    null;


let ultimaCaptura =
    0;


let totalVehiculos =
    0;


/*
Placas recientemente vistas.
*/

const historial =
    new Map();


/*
Última respuesta recibida.
*/

let ultimaRespuesta =
    null;


/*
Sesión única del navegador.
*/

const SESION =

    sessionStorage.getItem(
        "smartPlateSesion"
    )

    ||

    crearId();



sessionStorage.setItem(

    "smartPlateSesion",

    SESION

);



/* =========================================================

GENERAR ID

========================================================= */

function crearId() {


    if (

        window.crypto

        &&

        crypto.randomUUID

    ) {


        return crypto.randomUUID();

    }


    return (

        Date.now()

        +

        "-"

        +

        Math.random()
            .toString(36)
            .substring(2)

    );

}



/* =========================================================

MENSAJES

========================================================= */

function mensaje(

    texto,

    detalle = ""

) {


    document.getElementById(
        "estado"
    ).innerText = texto;


    document.getElementById(
        "detalle"
    ).innerText = detalle;

}



/* =========================================================

INICIAR CÁMARA

========================================================= */

async function iniciarCamara() {


    const video =

        document.getElementById(
            "video"
        );


    try {


        mensaje(

            "📷 Iniciando cámara...",

            "Permite acceso a la cámara."

        );


        streamCamara =

            await navigator
                .mediaDevices
                .getUserMedia({


                    video: {


                        facingMode: {

                            ideal:
                                "environment"

                        },


                        width: {

                            ideal:
                                1920

                        },


                        height: {

                            ideal:
                                1080

                        }


                    },


                    audio:
                        false


                });


        video.srcObject =
            streamCamara;


        await video.play();


        camaraActiva =
            true;


        document.getElementById(
            "btnIniciar"
        ).disabled = true;


        document.getElementById(
            "btnDetener"
        ).disabled = false;


        prepararOverlay();


        dibujarZonaLectura();


        mensaje(

            "🎯 Sistema listo",

            "Coloca la placa dentro de la zona de lectura."

        );


        cambiarServidor(
            true
        );


        programarCaptura();


    } catch (error) {


        console.error(error);


        mensaje(

            "❌ No se pudo iniciar cámara",

            error.name
            +
            ": "
            +
            error.message

        );

    }

}



/* =========================================================

DETENER

========================================================= */

function detenerCamara() {


    camaraActiva =
        false;


    procesando =
        false;


    if (temporizador) {


        clearTimeout(
            temporizador
        );


        temporizador =
            null;

    }


    if (streamCamara) {


        streamCamara
            .getTracks()
            .forEach(

                track =>
                    track.stop()

            );


        streamCamara =
            null;

    }


    document.getElementById(
        "video"
    ).srcObject =
        null;


    limpiarOverlay();


    document.getElementById(
        "btnIniciar"
    ).disabled =
        false;


    document.getElementById(
        "btnDetener"
    ).disabled =
        true;


    cambiarServidor(
        false
    );


    mensaje(

        "⏹ Cámara detenida",

        "Presiona INICIAR para continuar."

    );

}



/* =========================================================

OVERLAY

========================================================= */

function prepararOverlay() {


    const video =

        document.getElementById(
            "video"
        );


    const overlay =

        document.getElementById(
            "overlay"
        );


    overlay.width =
        video.videoWidth;


    overlay.height =
        video.videoHeight;

}



/* =========================================================

ZONA DE LECTURA

========================================================= */

function obtenerZonaLectura() {


    const video =

        document.getElementById(
            "video"
        );


    /*
    Analizamos aproximadamente
    86% del ancho
    y 60% de la altura.

    Deja fuera principalmente
    techo y piso.
    */


    const width =

        video.videoWidth
        *
        0.86;


    const height =

        video.videoHeight
        *
        0.60;


    const x =

        (
            video.videoWidth
            -
            width
        )
        /
        2;


    const y =

        (
            video.videoHeight
            -
            height
        )
        /
        2;


    return {

        x,

        y,

        width,

        height

    };

}



/* =========================================================

DIBUJAR ZONA

========================================================= */

function dibujarZonaLectura() {


    if (!camaraActiva) {

        return;

    }


    const overlay =

        document.getElementById(
            "overlay"
        );


    const ctx =

        overlay.getContext(
            "2d"
        );


    const zona =
        obtenerZonaLectura();


    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );


    /*
    Zona amarilla inicial.
    */

    ctx.strokeStyle =
        "#ffd600";


    ctx.lineWidth =
        5;


    ctx.setLineDash([
        20,
        12
    ]);


    ctx.strokeRect(

        zona.x,

        zona.y,

        zona.width,

        zona.height

    );


    ctx.setLineDash([]);


    /*
    Etiqueta
    */

    ctx.fillStyle =
        "#ffd600";


    ctx.fillRect(

        zona.x,

        zona.y,

        245,

        40

    );


    ctx.fillStyle =
        "#000";


    ctx.font =
        "bold 24px Arial";


    ctx.fillText(

        "ZONA DE LECTURA",

        zona.x + 10,

        zona.y + 28

    );

}



/* =========================================================

LIMPIAR

========================================================= */

function limpiarOverlay() {


    const overlay =

        document.getElementById(
            "overlay"
        );


    const ctx =

        overlay.getContext(
            "2d"
        );


    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );

}



/* =========================================================

PROGRAMAR SIGUIENTE CAPTURA

========================================================= */

function programarCaptura() {


    if (!camaraActiva) {

        return;

    }


    if (temporizador) {


        clearTimeout(
            temporizador
        );

    }


    temporizador =

        setTimeout(

            capturarYEnviar,

            INTERVALO_CAPTURA

        );

}



/* =========================================================

CAPTURAR IMAGEN

========================================================= */

async function capturarYEnviar() {


    if (

        !camaraActiva

        ||

        procesando

    ) {


        programarCaptura();

        return;

    }


    procesando =
        true;


    const inicio =
        performance.now();


    try {


        const video =

            document.getElementById(
                "video"
            );


        const canvas =

            document.getElementById(
                "captura"
            );


        const zona =
            obtenerZonaLectura();


        /*
        Tamaño del JPEG
        que enviaremos.
        */

        const anchoDestino =

            Math.min(

                ANCHO_ENVIO,

                Math.round(
                    zona.width
                )

            );


        const altoDestino =

            Math.round(

                zona.height

                /

                zona.width

                *

                anchoDestino

            );


        canvas.width =
            anchoDestino;


        canvas.height =
            altoDestino;


        const ctx =

            canvas.getContext(

                "2d",

                {
                    willReadFrequently:
                        false
                }

            );


        /*
        Dibujamos SOLAMENTE
        la zona de interés.
        */

        ctx.drawImage(

            video,


            zona.x,

            zona.y,

            zona.width,

            zona.height,


            0,

            0,

            anchoDestino,

            altoDestino

        );


        /*
        Convertimos a JPEG.
        */

        const dataURL =

            canvas.toDataURL(

                "image/jpeg",

                CALIDAD_JPEG

            );


        /*
        Quitamos:

        data:image/jpeg;base64,
        */

        const base64 =

            dataURL.split(
                ","
            )[1];


        mensaje(

            "📡 Analizando vehículo...",

            "Enviando imagen al detector ALPR."

        );


        /*
        Enviar imagen al servidor.

        no-cors es intencional.

        Apps Script procesará la captura
        de forma privada.
        */

        await fetch(

            API_URL,

            {

                method:
                    "POST",

                mode:
                    "no-cors",

                headers: {

                    "Content-Type":

                        "text/plain;charset=utf-8"

                },

                body:

                    JSON.stringify({

                        accion:
                            "analizar",


                        sesion:
                            SESION,


                        imagen:
                            base64,


                        tipo:
                            "image/jpeg",


                        width:
                            anchoDestino,


                        height:
                            altoDestino,


                        timestamp:
                            Date.now()

                    })

            }

        );


        /*
        Pedimos el resultado unos
        milisegundos después.
        */

        setTimeout(

            solicitarResultado,

            450

        );


        setTimeout(

            solicitarResultado,

            900

        );


        setTimeout(

            solicitarResultado,

            1500

        );


        const fin =
            performance.now();


        ultimaCaptura =

            Math.round(
                fin - inicio
            );


    } catch (error) {


        console.error(
            error
        );


        mensaje(

            "⚠️ Error enviando imagen",

            error.message

        );


    } finally {


        procesando =
            false;


        if (camaraActiva) {


            programarCaptura();

        }

    }

}



/* =========================================================

CONSULTAR RESULTADO

Usamos JSONP para poder leer
la respuesta de Apps Script
desde GitHub Pages.

========================================================= */

function solicitarResultado() {


    if (!camaraActiva) {

        return;

    }


    const callback =

        "smartPlateCallback_"

        +

        Date.now()

        +

        "_"

        +

        Math.floor(
            Math.random() * 10000
        );


    const script =

        document.createElement(
            "script"
        );


    let terminado =
        false;



    window[callback] =

        function(datos) {


            if (terminado) {

                return;

            }


            terminado =
                true;


            try {


                procesarResultado(
                    datos
                );


            } finally {


                limpiarJSONP();

            }

        };



    function limpiarJSONP() {


        try {

            delete window[
                callback
            ];

        } catch (_) {}


        try {

            script.remove();

        } catch (_) {}

    }



    script.onerror =

        function() {


            if (!terminado) {


                terminado =
                    true;


                limpiarJSONP();

            }

        };


    script.src =

        API_URL

        +

        "?accion=resultado"

        +

        "&sesion="

        +

        encodeURIComponent(
            SESION
        )

        +

        "&callback="

        +

        encodeURIComponent(
            callback
        )

        +

        "&t="

        +

        Date.now();


    document.body.appendChild(
        script
    );


    /*
    Limpieza automática.
    */

    setTimeout(

        function() {


            if (!terminado) {


                terminado =
                    true;


                limpiarJSONP();

            }

        },

        5000

    );

}



/* =========================================================

PROCESAR RESPUESTA DEL SERVIDOR

Esperamos algo así:

{
  ok: true,
  results: [
    {
      plate: "ABC123",
      score: 0.95,
      box: {
        xmin: 100,
        ymin: 50,
        xmax: 260,
        ymax: 110
      }
    }
  ],
  width: 900,
  height: 500,
  processing_ms: 850
}

========================================================= */

function procesarResultado(
    datos
) {


    if (

        !datos

        ||

        !datos.ok

    ) {


        if (

            datos

            &&

            datos.procesando

        ) {


            mensaje(

                "🧠 Reconociendo placa...",

                "Esperando respuesta del servidor."

            );


        }


        return;

    }


    ultimaRespuesta =
        datos;


    cambiarServidor(
        true
    );


    /*
    Tiempo total.
    */

    if (

        datos.processing_ms
        !== undefined

    ) {


        document.getElementById(
            "tiempo"
        ).innerText =

            (
                Number(
                    datos.processing_ms
                )

                /
                1000

            ).toFixed(1)

            +

            "s";

    }


    const resultados =

        Array.isArray(
            datos.results
        )

        ?

        datos.results

        :

        [];


    dibujarResultados(

        resultados,

        Number(
            datos.width || 900
        ),

        Number(
            datos.height || 500
        )

    );


    actualizarLista(
        resultados
    );


    procesarVehiculos(
        resultados
    );



    if (

        resultados.length === 0

    ) {


        mensaje(

            "🔎 Buscando placa...",

            "Mantén el vehículo dentro de la zona amarilla."

        );


    } else {


        mensaje(

            "✅ "
            +
            resultados.length
            +
            (
                resultados.length === 1
                ?
                " placa detectada"
                :
                " placas detectadas"
            ),

            "Resultado recibido correctamente."

        );

    }

}



/* =========================================================

FORMATO DE PLACA

ABC123 -> ABC-123

========================================================= */

function formatearPlaca(
    texto
) {


    if (!texto) {

        return "";
    }


    let limpio =

        String(texto)
            .toUpperCase()
            .replace(
                /[^A-Z0-9]/g,
                ""
            );


    /*
    Para las placas ficticias
    de nuestra maqueta.
    */

    if (

        /^[A-Z]{3}[0-9]{3}$/
            .test(limpio)

    ) {


        return (

            limpio.substring(
                0,
                3
            )

            +

            "-"

            +

            limpio.substring(
                3,
                6
            )

        );

    }


    /*
    Si en el futuro probamos
    otro formato, no lo destruimos.
    */

    return limpio;

}



/* =========================================================

DIBUJAR RECTÁNGULOS

========================================================= */

function dibujarResultados(

    resultados,

    imageWidth,

    imageHeight

) {


    if (!camaraActiva) {

        return;

    }


    const video =

        document.getElementById(
            "video"
        );


    const overlay =

        document.getElementById(
            "overlay"
        );


    /*
    Adaptar canvas.
    */

    overlay.width =
        video.videoWidth;


    overlay.height =
        video.videoHeight;


    const ctx =

        overlay.getContext(
            "2d"
        );


    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );


    const zona =
        obtenerZonaLectura();



    /*
    Mantener visible zona de captura.
    */

    ctx.strokeStyle =
        "#ffd600";


    ctx.lineWidth =
        4;


    ctx.setLineDash([
        20,
        12
    ]);


    ctx.strokeRect(

        zona.x,

        zona.y,

        zona.width,

        zona.height

    );


    ctx.setLineDash([]);



    /*
    Dibujar cada placa.
    */

    resultados.forEach(

        resultado => {


            if (!resultado.box) {

                return;
            }


            const box =
                resultado.box;


            /*
            Coordenadas API
            corresponden al JPEG enviado.

            Las convertimos a coordenadas
            de la cámara.
            */


            const x =

                zona.x

                +

                (
                    Number(
                        box.xmin
                    )

                    /
                    imageWidth
                )

                *

                zona.width;


            const y =

                zona.y

                +

                (
                    Number(
                        box.ymin
                    )

                    /
                    imageHeight
                )

                *

                zona.height;


            const xmax =

                zona.x

                +

                (
                    Number(
                        box.xmax
                    )

                    /
                    imageWidth
                )

                *

                zona.width;


            const ymax =

                zona.y

                +

                (
                    Number(
                        box.ymax
                    )

                    /
                    imageHeight
                )

                *

                zona.height;


            const width =
                xmax - x;


            const height =
                ymax - y;


            /*
            Margen alrededor
            de la placa.
            */

            const margenX =

                width
                *
                0.10;


            const margenY =

                height
                *
                0.25;


            const rx =

                Math.max(
                    0,
                    x - margenX
                );


            const ry =

                Math.max(
                    0,
                    y - margenY
                );


            const rw =

                width
                +
                margenX * 2;


            const rh =

                height
                +
                margenY * 2;



            /*
            Rectángulo verde.
            */

            ctx.strokeStyle =
                "#00ff55";


            ctx.lineWidth =
                7;


            ctx.strokeRect(

                rx,

                ry,

                rw,

                rh

            );



            /*
            Placa reconocida.
            */

            const placa =

                formatearPlaca(
                    resultado.plate
                );


            ctx.font =
                "bold 28px Arial";


            const textoWidth =

                ctx.measureText(
                    placa
                ).width;


            const etiquetaWidth =

                textoWidth
                +
                20;


            const etiquetaHeight =
                38;


            const etiquetaY =

                Math.max(

                    0,

                    ry
                    -
                    etiquetaHeight

                );


            ctx.fillStyle =
                "#00ff55";


            ctx.fillRect(

                rx,

                etiquetaY,

                etiquetaWidth,

                etiquetaHeight

            );


            ctx.fillStyle =
                "#000";


            ctx.fillText(

                placa,

                rx + 10,

                etiquetaY + 28

            );

        }

    );

}



/* =========================================================

LISTA DE PLACAS

========================================================= */

function actualizarLista(
    resultados
) {


    const lista =

        document.getElementById(
            "listaPlacas"
        );


    if (

        resultados.length === 0

    ) {


        lista.innerHTML =
            "---";


        return;

    }


    lista.innerHTML =
        "";


    resultados.forEach(

        resultado => {


            const placa =

                formatearPlaca(
                    resultado.plate
                );


            const confianza =

                Math.round(

                    Number(
                        resultado.score || 0
                    )

                    *
                    100

                );


            const item =

                document.createElement(
                    "div"
                );


            item.className =
                "placaItem";


            item.innerHTML =

                "🚗 "

                +

                placa

                +

                "<div class='confianza'>"

                +

                confianza

                +

                "% confianza"

                +

                "</div>";


            lista.appendChild(
                item
            );

        }

    );

}



/* =========================================================

CONTAR VEHÍCULOS

========================================================= */

function procesarVehiculos(
    resultados
) {


    const ahora =
        Date.now();


    resultados.forEach(

        resultado => {


            const placa =

                formatearPlaca(
                    resultado.plate
                );


            if (!placa) {

                return;
            }


            /*
            Última placa grande.
            */

            document.getElementById(
                "ultimaPlaca"
            ).innerText =
                placa;


            const ultimaVez =

                historial.get(
                    placa
                )

                ||

                0;


            /*
            Solamente contamos como
            nuevo vehículo si no fue
            visto recientemente.
            */

            if (

                ahora
                -
                ultimaVez

                >
                TIEMPO_DUPLICADO

            ) {


                totalVehiculos++;


                document.getElementById(
                    "contador"
                ).innerText =

                    totalVehiculos;

            }


            historial.set(

                placa,

                ahora

            );

        }

    );

}



/* =========================================================

ESTADO SERVIDOR

========================================================= */

function cambiarServidor(
    conectado
) {


    const indicador =

        document.getElementById(
            "indicador"
        );


    const texto =

        document.getElementById(
            "estadoApi"
        );


    if (conectado) {


        indicador.style.background =
            "#00c853";


        texto.innerText =
            "ON";


    } else {


        indicador.style.background =
            "#aaa";


        texto.innerText =
            "OFF";

    }

}

AJUSTAR AL GIRAR TABLET

        if (camaraActiva) {

            dibujarZonaLectura();

AL CERRAR

window.addEventListener(

        if (streamCamara) {


            streamCamara
                .getTracks()
                .forEach(

    }

);
