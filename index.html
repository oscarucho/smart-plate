<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Plate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
            background: #f2f4f7;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitulo {
            color: #666;
            margin-bottom: 15px;
        }

        .camara {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: auto;
            background: black;
            border-radius: 15px;
            overflow: hidden;
            min-height: 220px;
        }

        video {
            width: 100%;
            display: block;
        }

        #overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .botones {
            margin-top: 15px;
        }

        button {
            padding: 15px 22px;
            font-size: 17px;
            border: none;
            border-radius: 12px;
            color: white;
            margin: 5px;
            cursor: pointer;
        }

        #btnCamara {
            background: #1976d2;
        }

        #btnDetener {
            background: #d32f2f;
        }

        button:disabled {
            opacity: 0.5;
        }

        .estado {
            max-width: 700px;
            margin: 15px auto;
            padding: 15px;
            background: white;
            border-radius: 15px;
        }

        #mensaje {
            font-size: 18px;
            font-weight: bold;
        }

        .resultado {
            max-width: 700px;
            margin: 15px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
        }

        .tituloPlaca {
            font-size: 15px;
            color: #555;
        }

        .placa {
            margin-top: 10px;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        #procesamiento {
            display: none;
        }

        .paso {
            margin-top: 8px;
            font-size: 13px;
            color: #777;
        }

    </style>

</head>


<body>


    <h1>🚗 AARÓN SECURITY</h1>

    <div class="subtitulo">
        Detector inteligente de placas - Edificio Fisher 155
    </div>


    <!-- CÁMARA -->

    <div class="camara">

        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>

        <canvas id="overlay"></canvas>

    </div>


    <!-- BOTONES -->

    <div class="botones">

        <button
            id="btnCamara"
            onclick="iniciarCamara()"
        >
            📷 INICIAR CÁMARA
        </button>


        <button
            id="btnDetener"
            onclick="detenerCamara()"
            disabled
        >
            ⏹ DETENER
        </button>

    </div>


    <!-- ESTADO -->

    <div class="estado">

        <div id="mensaje">
            Presiona INICIAR CÁMARA
        </div>

        <div class="paso" id="detalle">
            Cámara detenida
        </div>

    </div>


    <!-- RESULTADO -->

    <div class="resultado">

        <div class="tituloPlaca">
            PLACA DETECTADA
        </div>

        <div
            class="placa"
            id="placa"
        >
            ---
        </div>

    </div>


    <!-- Canvas oculto para procesar imagen -->

    <canvas id="procesamiento"></canvas>



<script>

/* =========================================================

   VARIABLES GENERALES

========================================================= */

let CV = null;

let streamCamara = null;

let camaraActiva = false;

let procesando = false;

let intervaloDeteccion = null;

let cargandoOpenCV = false;



/* =========================================================

   MENSAJES

========================================================= */

function mostrarMensaje(texto, detalle = "") {

    document.getElementById("mensaje").innerText =
        texto;

    document.getElementById("detalle").innerText =
        detalle;

}



/* =========================================================

   1. INICIAR CÁMARA

========================================================= */

async function iniciarCamara() {

    const video =
        document.getElementById("video");

    const btnCamara =
        document.getElementById("btnCamara");

    const btnDetener =
        document.getElementById("btnDetener");


    try {

        mostrarMensaje(
            "📷 Solicitando acceso a la cámara...",
            "Android puede pedir permiso para utilizar la cámara."
        );


        /*
        Comprobar que el navegador soporte cámara
        */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            mostrarMensaje(
                "❌ Cámara no disponible",
                "El navegador no permite utilizar getUserMedia."
            );

            return;

        }


        /*
        Pedimos cámara trasera.

        "environment" indica preferencia por la cámara
        que apunta hacia afuera.
        */

        streamCamara =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        /*
        Conectamos la cámara al video
        */

        video.srcObject =
            streamCamara;


        /*
        Esperamos a que Android entregue
        información de la cámara.
        */

        await new Promise((resolve) => {

            if (video.readyState >= 1) {

                resolve();

            } else {

                video.onloadedmetadata =
                    () => resolve();

            }

        });


        /*
        Mostramos el video.
        */

        await video.play();


        camaraActiva =
            true;


        btnCamara.disabled =
            true;

        btnDetener.disabled =
            false;


        prepararOverlay();


        mostrarMensaje(
            "✅ Cámara funcionando",
            "Ahora cargaremos el detector de placas."
        );


        /*
        MUY IMPORTANTE:

        Primero hacemos funcionar la cámara.

        DESPUÉS cargamos OpenCV.
        */

        cargarOpenCV();


    } catch (error) {

        console.error(
            "ERROR CÁMARA:",
            error
        );


        let texto =
            "❌ No se pudo iniciar la cámara";


        if (error.name === "NotAllowedError") {

            texto =
                "❌ No se dio permiso para usar la cámara";

        }


        if (error.name === "NotFoundError") {

            texto =
                "❌ No se encontró ninguna cámara";

        }


        if (error.name === "NotReadableError") {

            texto =
                "❌ La cámara está siendo utilizada por otra aplicación";

        }


        mostrarMensaje(
            texto,
            error.name + ": " + error.message
        );

    }

}



/* =========================================================

   2. DETENER CÁMARA

========================================================= */

function detenerCamara() {

    camaraActiva =
        false;


    /*
    Detener detector
    */

    if (intervaloDeteccion) {

        clearInterval(
            intervaloDeteccion
        );

        intervaloDeteccion =
            null;

    }


    /*
    Apagar físicamente la cámara
    */

    if (streamCamara) {

        streamCamara
            .getTracks()
            .forEach(track => {

                track.stop();

            });

        streamCamara =
            null;

    }


    const video =
        document.getElementById("video");

    video.srcObject =
        null;


    /*
    Borrar rectángulos
    */

    limpiarOverlay();


    document.getElementById(
        "btnCamara"
    ).disabled = false;


    document.getElementById(
        "btnDetener"
    ).disabled = true;


    mostrarMensaje(
        "⏹ Cámara detenida",
        "Puedes volver a iniciarla."
    );

}



/* =========================================================

   3. PREPARAR CANVAS SOBRE LA CÁMARA

========================================================= */

function prepararOverlay() {

    const video =
        document.getElementById("video");

    const overlay =
        document.getElementById("overlay");


    overlay.width =
        video.videoWidth;

    overlay.height =
        video.videoHeight;

}



function limpiarOverlay() {

    const overlay =
        document.getElementById("overlay");

    const ctx =
        overlay.getContext("2d");


    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );

}



/* =========================================================

   4. CARGAR OPENCV

========================================================= */

async function cargarOpenCV() {


    /*
    Si ya tenemos OpenCV listo,
    iniciamos directamente detección.
    */

    if (
        CV &&
        typeof CV.Mat !== "undefined"
    ) {

        iniciarDetector();

        return;

    }


    /*
    Evitamos cargar dos veces.
    */

    if (cargandoOpenCV) {

        return;

    }


    cargandoOpenCV =
        true;


    mostrarMensaje(
        "⏳ Cámara OK. Cargando detector...",
        "La primera carga puede tardar algunos segundos."
    );


    /*
    ¿OpenCV ya existe?
    */

    if (typeof window.cv !== "undefined") {

        await prepararOpenCV();

        return;

    }


    /*
    Crear el script dinámicamente.

    OpenCV NO se carga hasta que
    la cámara ya funciona.
    */

    const script =
        document.createElement("script");


    script.id =
        "opencv-script";


    script.src =
        "https://docs.opencv.org/4.x/opencv.js";


    script.async =
        true;


    script.onload =
        async function () {

            await prepararOpenCV();

        };


    script.onerror =
        function () {

            cargandoOpenCV =
                false;

            mostrarMensaje(
                "⚠️ Cámara funcionando, pero el detector no cargó",
                "Comprueba que tienes conexión a Internet y vuelve a cargar la página."
            );

        };


    document.body.appendChild(
        script
    );

}



/* =========================================================

   5. ESPERAR QUE OPENCV ESTÉ LISTO

========================================================= */

async function prepararOpenCV() {

    try {

        mostrarMensaje(
            "⏳ Preparando OpenCV...",
            "La cámara seguirá funcionando mientras esperamos."
        );


        /*
        Versiones recientes pueden entregar
        cv como una Promesa.
        */

        if (
            typeof window.cv !== "undefined" &&
            typeof window.cv.then === "function"
        ) {

            CV =
                await window.cv;

        } else {

            CV =
                window.cv;

        }


        /*
        Si todavía no aparece Mat,
        esperamos hasta 20 segundos.
        */

        let intentos =
            0;


        while (
            (
                !CV ||
                typeof CV.Mat === "undefined"
            )
            &&
            intentos < 100
        ) {

            await esperar(200);

            CV =
                window.cv;

            intentos++;

        }


        if (
            !CV ||
            typeof CV.Mat === "undefined"
        ) {

            throw new Error(
                "OpenCV no terminó de inicializar."
            );

        }


        cargandoOpenCV =
            false;


        mostrarMensaje(
            "✅ Detector listo",
            "Buscando una forma parecida a una placa..."
        );


        iniciarDetector();


    } catch (error) {

        console.error(
            "ERROR OPENCV:",
            error
        );


        cargandoOpenCV =
            false;


        mostrarMensaje(
            "⚠️ Cámara funcionando, pero OpenCV tuvo un problema",
            error.message
        );

    }

}



/* =========================================================

   FUNCIÓN PARA ESPERAR

========================================================= */

function esperar(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}



/* =========================================================

   6. INICIAR DETECTOR

========================================================= */

function iniciarDetector() {


    if (!camaraActiva) {

        return;

    }


    if (intervaloDeteccion) {

        clearInterval(
            intervaloDeteccion
        );

    }


    mostrarMensaje(
        "🔎 Buscando placa...",
        "Coloca una placa rectangular frente a la cámara."
    );


    /*
    Analizamos aproximadamente
    cada 700 milisegundos.

    Esto evita exigir demasiado
    a la tablet.
    */

    intervaloDeteccion =
        setInterval(

            detectarPlaca,

            700

        );

}



/* =========================================================

   7. DETECTAR POSIBLE PLACA

========================================================= */

function detectarPlaca() {


    if (
        !camaraActiva ||
        procesando ||
        !CV
    ) {

        return;

    }


    const video =
        document.getElementById("video");


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        return;

    }


    procesando =
        true;


    let src = null;

    let gris = null;

    let borroso = null;

    let bordes = null;

    let contornos = null;

    let jerarquia = null;

    let kernel = null;


    try {


        /* =================================================
           CAPTURAR IMAGEN DE LA CÁMARA
        ================================================= */


        const canvas =
            document.getElementById(
                "procesamiento"
            );


        const ctx =
            canvas.getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            );


        /*
        Usamos una imagen pequeña
        para que sea rápido en la tablet.
        */

        const anchoProceso =
            480;


        const altoProceso =
            Math.round(

                video.videoHeight
                /
                video.videoWidth
                *
                anchoProceso

            );


        canvas.width =
            anchoProceso;


        canvas.height =
            altoProceso;


        ctx.drawImage(

            video,

            0,
            0,

            anchoProceso,
            altoProceso

        );



        /* =================================================
           PASAR IMAGEN A OPENCV
        ================================================= */


        src =
            CV.imread(canvas);


        gris =
            new CV.Mat();


        borroso =
            new CV.Mat();


        bordes =
            new CV.Mat();



        /*
        Imagen en blanco y negro
        */

        CV.cvtColor(

            src,

            gris,

            CV.COLOR_RGBA2GRAY

        );



        /*
        Suavizar ruido
        */

        CV.GaussianBlur(

            gris,

            borroso,

            new CV.Size(5, 5),

            0

        );



        /*
        Encontrar bordes
        */

        CV.Canny(

            borroso,

            bordes,

            60,

            180

        );



        /*
        Unir bordes cercanos
        */

        kernel =
            CV.Mat.ones(

                3,

                3,

                CV.CV_8U

            );


        CV.morphologyEx(

            bordes,

            bordes,

            CV.MORPH_CLOSE,

            kernel

        );



        /* =================================================
           BUSCAR CONTORNOS
        ================================================= */


        contornos =
            new CV.MatVector();


        jerarquia =
            new CV.Mat();


        CV.findContours(

            bordes,

            contornos,

            jerarquia,

            CV.RETR_EXTERNAL,

            CV.CHAIN_APPROX_SIMPLE

        );



        let mejorPlaca =
            null;


        let mejorPuntaje =
            0;


        const areaImagen =
            anchoProceso
            *
            altoProceso;



        /* =================================================
           ANALIZAR CONTORNOS
        ================================================= */


        for (

            let i = 0;

            i < contornos.size();

            i++

        ) {


            const contorno =
                contornos.get(i);


            let aproximado =
                null;


            try {


                const perimetro =
                    CV.arcLength(

                        contorno,

                        true

                    );


                aproximado =
                    new CV.Mat();


                CV.approxPolyDP(

                    contorno,

                    aproximado,

                    0.02 * perimetro,

                    true

                );


                const rect =
                    CV.boundingRect(
                        aproximado
                    );


                const area =
                    rect.width
                    *
                    rect.height;


                /*
                Relación ancho / alto
                */

                const proporcion =
                    rect.width
                    /
                    Math.max(
                        rect.height,
                        1
                    );



                /*
                FILTROS DE PLACA
                */


                const formaCorrecta =

                    aproximado.rows >= 4
                    &&
                    aproximado.rows <= 8;



                const proporcionCorrecta =

                    proporcion > 2.0
                    &&
                    proporcion < 6.5;



                const tamanoCorrecto =

                    area
                    >
                    areaImagen * 0.004

                    &&

                    area
                    <
                    areaImagen * 0.35;



                const anchoCorrecto =

                    rect.width > 60

                    &&

                    rect.height > 15;



                /*
                Si cumple condiciones,
                puede ser una placa.
                */


                if (

                    formaCorrecta

                    &&

                    proporcionCorrecta

                    &&

                    tamanoCorrecto

                    &&

                    anchoCorrecto

                ) {


                    /*
                    Favorecemos formas grandes
                    y proporciones cercanas
                    a un rectángulo de placa.
                    */

                    const diferencia =
                        Math.abs(
                            proporcion - 4
                        );


                    const puntaje =
                        area
                        /
                        (
                            1
                            +
                            diferencia
                        );



                    if (
                        puntaje >
                        mejorPuntaje
                    ) {


                        mejorPuntaje =
                            puntaje;


                        mejorPlaca = {

                            x:
                                rect.x,

                            y:
                                rect.y,

                            width:
                                rect.width,

                            height:
                                rect.height

                        };

                    }

                }


            } finally {


                if (aproximado) {

                    aproximado.delete();

                }


                contorno.delete();

            }

        }



        /* =================================================
           MOSTRAR RESULTADO
        ================================================= */


        dibujarResultado(

            mejorPlaca,

            anchoProceso,

            altoProceso

        );


    } catch (error) {


        console.error(
            "ERROR DETECCIÓN:",
            error
        );


        mostrarMensaje(
            "⚠️ Error durante la detección",
            error.message
        );


    } finally {


        /*
        Liberamos memoria de OpenCV.
        Muy importante en tablets y celulares.
        */


        if (src) {
            src.delete();
        }


        if (gris) {
            gris.delete();
        }


        if (borroso) {
            borroso.delete();
        }


        if (bordes) {
            bordes.delete();
        }


        if (contornos) {
            contornos.delete();
        }


        if (jerarquia) {
            jerarquia.delete();
        }


        if (kernel) {
            kernel.delete();
        }


        procesando =
            false;

    }

}



/* =========================================================

   8. DIBUJAR RECTÁNGULO VERDE

========================================================= */

function dibujarResultado(

    rect,

    anchoProceso,

    altoProceso

) {


    const video =
        document.getElementById("video");


    const overlay =
        document.getElementById("overlay");


    const ctx =
        overlay.getContext("2d");


    /*
    Adaptamos canvas al tamaño
    real de la cámara.
    */

    if (

        overlay.width !==
        video.videoWidth

        ||

        overlay.height !==
        video.videoHeight

    ) {

        overlay.width =
            video.videoWidth;


        overlay.height =
            video.videoHeight;

    }



    /*
    Limpiar rectángulo anterior
    */

    ctx.clearRect(

        0,

        0,

        overlay.width,

        overlay.height

    );



    /*
    No encontramos placa
    */

    if (!rect) {


        mostrarMensaje(
            "🔎 Buscando placa...",
            "Acerca la placa y procura que tenga buena iluminación."
        );


        return;

    }



    /*
    Escalar coordenadas
    */

    const escalaX =

        video.videoWidth
        /
        anchoProceso;


    const escalaY =

        video.videoHeight
        /
        altoProceso;



    const x =

        rect.x
        *
        escalaX;


    const y =

        rect.y
        *
        escalaY;


    const ancho =

        rect.width
        *
        escalaX;


    const alto =

        rect.height
        *
        escalaY;



    /* =================================================
       RECTÁNGULO VERDE
    ================================================= */


    ctx.strokeStyle =
        "#00ff55";


    ctx.lineWidth =
        8;


    ctx.strokeRect(

        x,

        y,

        ancho,

        alto

    );



    /* =================================================
       ETIQUETA PLACA
    ================================================= */


    ctx.fillStyle =
        "#00ff55";


    ctx.font =
        "bold 28px Arial";


    ctx.fillText(

        "PLACA",

        x,

        Math.max(
            32,
            y - 10
        )

    );



    mostrarMensaje(
        "✅ Posible placa detectada",
        "En el siguiente paso leeremos sus letras y números."
    );

}

</script>


</body>

</html>
